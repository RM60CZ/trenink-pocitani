<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyramida – dopočítávačka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1rem;
            color: #a0a0b0;
            margin-bottom: 20px;
        }

        .pyramid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .cell {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #2c3e50;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 1px 3px rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffd700;
            transition: all 0.3s ease;
            position: relative;
        }

        .cell.given {
            background: linear-gradient(145deg, #2a2a40, #1e1e30);
            color: #f6d365;
            cursor: default;
            border: 2px solid #f6d365;
            box-shadow: 0 0 18px rgba(246, 211, 101, 0.3), 0 4px 12px rgba(0,0,0,0.6);
        }

        .cell.empty {
            background: #243447;
            border: 2px dashed #4a5568;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffd700;
            outline: none;
            font-family: inherit;
        }

        .cell input::placeholder {
            color: #4a5568;
            font-size: 0.8rem;
        }

        .cell.correct {
            background: linear-gradient(145deg, #276749, #1c4532);
            border-color: #68d391;
            box-shadow: 0 0 18px rgba(104, 211, 145, 0.5);
            animation: pulse 0.6s ease;
        }

        .cell.incorrect {
            background: linear-gradient(145deg, #9b2c2c, #742a2a);
            border-color: #fc8181;
            box-shadow: 0 0 18px rgba(252, 129, 129, 0.5);
            animation: shake 0.4s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-new {
            background: linear-gradient(135deg, #f6d365, #fda085);
            color: #1a1a2e;
        }

        .btn-check {
            background: linear-gradient(135deg, #68d391, #38a169);
            color: #1a1a2e;
        }

        .btn-show {
            background: linear-gradient(135deg, #63b3ed, #3182ce);
            color: #1a1a2e;
        }

        .btn-clear {
            background: linear-gradient(135deg, #cbd5e0, #a0aec0);
            color: #1a1a2e;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔺 Pyramida</h1>
        <p class="subtitle">Doplň prázdná políčka – každé políčko je součtem dvou pod sebou</p>
        <div class="pyramid" id="pyramid"></div>
        <div class="controls">
            <button class="btn-new" onclick="newPyramid()">🔄 Nová pyramida</button>
            <button class="btn-check" onclick="checkPyramid()">✅ Zkontrolovat</button>
            <button class="btn-show" onclick="showSolution()">👁 Zobrazit řešení</button>
            <button class="btn-clear" onclick="clearInputs()">🧹 Vymazat</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <script>
        // Globální proměnné
        let pyramid = [];          // celá vypočtená pyramida (pole řádků)
        // Pevné pozice, které budou vždy odhalené (row, col) – 0‑indexováno od shora, zleva
        const GIVEN_POSITIONS = new Set([
            // spodní řádek (řádek 6) – odkryto 5 buněk, schované sloupce 2 a 4
            [6, 0], [6, 1], [6, 3], [6, 5], [6, 6],
            // o patro výš (řádek 5) – dvě buňky přímo nad schovanými dvojicemi
            [5, 1],            // součet buněk (6,1)+(6,2) – pomůže odhalit (6,2)
            [5, 3],            // součet buněk (6,3)+(6,4) – pomůže odhalit (6,4)
            // vrchol
            [0, 0],
            // jedna vnitřní kontrolní buňka
            [3, 2]
        ]);

        // Generování náhodné pyramidy (celá čísla 1‑15 ve spodní řadě)
        function generatePyramid() {
            const rows = 7;
            // spodní řada
            const bottom = [];
            for (let i = 0; i < rows; i++) {
                bottom.push(Math.floor(Math.random() * 15) + 1);
            }
            // pyramida jako pole řádků odspodu
            pyramid = [bottom];
            for (let r = 5; r >= 0; r--) {
                const prev = pyramid[pyramid.length - 1];
                const newRow = [];
                for (let c = 0; c <= r; c++) {
                    newRow.push(prev[c] + prev[c + 1]);
                }
                pyramid.push(newRow);
            }
            // otočíme, aby index 0 byl horní řádek
            pyramid.reverse();
        }

        // Vykreslení pyramidy do HTML
        function renderPyramid() {
            const container = document.getElementById('pyramid');
            container.innerHTML = '';
            for (let r = 0; r < pyramid.length; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';
                for (let c = 0; c < pyramid[r].length; c++) {
                    const cellDiv = document.createElement('div');
                    const isGiven = GIVEN_POSITIONS.has(JSON.stringify([r, c]));
                    cellDiv.className = isGiven ? 'cell given' : 'cell empty';
                    cellDiv.dataset.row = r;
                    cellDiv.dataset.col = c;

                    if (isGiven) {
                        // zobrazíme přímo číslo
                        cellDiv.textContent = pyramid[r][c];
                    } else {
                        // vstupní políčko
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.placeholder = '?';
                        input.dataset.row = r;
                        input.dataset.col = c;
                        cellDiv.appendChild(input);
                    }
                    rowDiv.appendChild(cellDiv);
                }
                container.appendChild(rowDiv);
            }
            document.getElementById('message').textContent = '';
        }

        // Kontrola vyplněných hodnot
        function checkPyramid() {
            const inputs = document.querySelectorAll('.cell.empty input');
            let allCorrect = true;
            inputs.forEach(inp => {
                const r = parseInt(inp.dataset.row);
                const c = parseInt(inp.dataset.col);
                const userVal = parseInt(inp.value.trim());
                const cellDiv = inp.parentNode;
                // odstranění předchozích tříd
                cellDiv.classList.remove('correct', 'incorrect');
                if (isNaN(userVal)) {
                    allCorrect = false;
                    cellDiv.classList.add('incorrect');
                    return;
                }
                if (userVal === pyramid[r][c]) {
                    cellDiv.classList.add('correct');
                } else {
                    cellDiv.classList.add('incorrect');
                    allCorrect = false;
                }
            });
            const msg = document.getElementById('message');
            if (inputs.length === 0) {
                msg.textContent = 'Není co kontrolovat – pyramida je plně zadaná.';
                msg.style.color = '#f6d365';
            } else if (allCorrect) {
                msg.textContent = '🎉 Všechna čísla jsou správně!';
                msg.style.color = '#68d391';
            } else {
                msg.textContent = '❌ Některá čísla jsou špatně – zkontroluj červená políčka.';
                msg.style.color = '#fc8181';
            }
        }

        // Zobrazení kompletního řešení
        function showSolution() {
            const inputs = document.querySelectorAll('.cell.empty input');
            inputs.forEach(inp => {
                const r = parseInt(inp.dataset.row);
                const c = parseInt(inp.dataset.col);
                inp.value = pyramid[r][c];
                inp.disabled = true;
                inp.parentNode.classList.add('correct');
            });
            document.getElementById('message').textContent = 'Zobrazilo se celé řešení.';
        }

        // Vymazání uživatelských vstupů a opětovné povolení
        function clearInputs() {
            const inputs = document.querySelectorAll('.cell.empty input');
            inputs.forEach(inp => {
                inp.value = '';
                inp.disabled = false;
                inp.parentNode.classList.remove('correct', 'incorrect');
            });
            document.getElementById('message').textContent = '';
        }

        // Nová pyramida
        function newPyramid() {
            generatePyramid();
            renderPyramid();
        }

        // Úvodní spuštění
        newPyramid();
    </script>
</body>
</html>
