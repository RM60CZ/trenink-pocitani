<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trénink počítání</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      width: 95%;
      max-width: 700px;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
      margin-top: 0;
      font-size: 1.8rem;
    }

    .controls {
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #34495e;
    }

    .label-top {
      font-weight: bold;
      color: #34495e;
      line-height: 1.3;
    }

    .label-bottom {
      font-weight: bold;
      color: #34495e;
      margin-bottom: 6px;
    }

    select, button {
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      min-width: 120px;
    }

    button:hover {
      background-color: #2980b9;
    }

    .example {
      font-family: monospace;
      font-size: 1.6rem;
      line-height: 1.6;
      margin: 25px 0;
      text-align: right;
      white-space: pre;
      direction: ltr;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
      margin: 15px 0;
      min-height: 24px;
    }

    .result-line {
      margin-top: 12px;
      font-family: monospace;
      font-size: 1.6rem;
      text-align: right;
      color: #27ae60;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: center;
      }
      .example, .result-line {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trénink počítání</h1>

    <div class="controls">
      <div class="control-group">
        <label for="operace">Operace:</label>
        <select id="operace">
          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
      </div>

      <div class="control-group">
        <span class="label-top">Počet číslic</span>
        <span class="label-bottom">1. čísla:</span>
        <select id="cislice1">
          <!-- Naplní se skriptem -->
        </select>
      </div>

      <div class="control-group">
        <span class="label-top">Počet číslic</span>
        <span class="label-bottom">2. čísla:</span>
        <select id="cislice2">
          <!-- Naplní se skriptem -->
        </select>
      </div>
    </div>

    <div class="error" id="chyba"></div>

    <div class="example" id="priklad">Zatím žádný příklad</div>
    <div class="result-line" id="vysledek"></div>

    <button id="tlacitko">START</button>
  </div>

  <script>
    function naplnCislice() {
      const sel1 = document.getElementById('cislice1');
      const sel2 = document.getElementById('cislice2');
      sel1.innerHTML = '';
      sel2.innerHTML = '';
      for (let i = 1; i <= 9; i++) {
        const opt1 = document.createElement('option');
        opt1.value = i;
        opt1.textContent = i;
        sel1.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = i;
        opt2.textContent = i;
        sel2.appendChild(opt2);
      }
      sel1.value = '2';
      sel2.value = '1';
    }

    function formatujCislo(cislo) {
      return cislo.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function generujCislo(pocetCislic) {
      const min = Math.pow(10, pocetCislic - 1);
      const max = Math.pow(10, pocetCislic) - 1;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let aktualniPriklad = null;

    function vygenerujPriklad() {
      const operace = document.getElementById('operace').value;
      const pocet1 = parseInt(document.getElementById('cislice1').value);
      const pocet2 = parseInt(document.getElementById('cislice2').value);

      const chybaEl = document.getElementById('chyba');
      chybaEl.textContent = '';

      if (operace === '-' && pocet1 < pocet2) {
        chybaEl.textContent = '❌ Nelze: 1. číslo má méně číslic → výsledek by byl záporný.';
        return null;
      }

      let cislo1, cislo2;
      let pokusy = 0;
      const MAX_POKUSU = 1000;

      while (pokusy < MAX_POKUSU) {
        pokusy++;
        cislo1 = generujCislo(pocet1);

        if (pocet2 === 1) {
          cislo2 = Math.floor(Math.random() * 8) + 2;
        } else {
          cislo2 = generujCislo(pocet2);
        }

        if (operace === '-' && cislo1 <= cislo2) continue;
        if (operace === '/' && cislo2 === 0) continue;

        break;
      }

      if (pokusy >= MAX_POKUSU) {
        chybaEl.textContent = '❌ Nepodařilo se vygenerovat platný příklad. Zkuste jinou kombinaci.';
        return null;
      }

      let vysledek;
      if (operace === '+') vysledek = cislo1 + cislo2;
      else if (operace === '-') vysledek = cislo1 - cislo2;
      else if (operace === '*') vysledek = cislo1 * cislo2;
      else if (operace === '/') vysledek = (cislo1 / cislo2).toFixed(4);

      return { cislo1, cislo2, operace, vysledek };
    }

    function zobrazPriklad(priklad) {
      const { cislo1, cislo2, operace } = priklad;
      const f1 = formatujCislo(cislo1);
      const f2 = formatujCislo(cislo2);

      const maxDelka = Math.max(f1.length, f2.length + 2);
      const radek1 = f1.padStart(maxDelka);
      const radek2 = operace + ' ' + f2.padStart(maxDelka - 2);

      document.getElementById('priklad').textContent = radek1 + '\n' + radek2;
      document.getElementById('vysledek').textContent = '';
    }

    function zobrazVysledek(priklad) {
      const fVysledek = typeof priklad.vysledek === 'string' 
        ? priklad.vysledek 
        : formatujCislo(priklad.vysledek);
      
      const maxDelka = Math.max(
        formatujCislo(priklad.cislo1).length,
        (priklad.operace + ' ' + formatujCislo(priklad.cislo2)).length,
        fVysledek.length
      );
      
      document.getElementById('vysledek').textContent = fVysledek.padStart(maxDelka);
    }

    let zobrazitVysledek = false;

    document.getElementById('tlacitko').addEventListener('click', () => {
      const tlacitko = document.getElementById('tlacitko');
      if (!zobrazitVysledek) {
        const priklad = vygenerujPriklad();
        if (!priklad) {
          tlacitko.textContent = 'START';
          zobrazitVysledek = false;
          return;
        }
        aktualniPriklad = priklad;
        zobrazPriklad(priklad);
        tlacitko.textContent = 'VÝSLEDEK';
        zobrazitVysledek = true;
      } else {
        zobrazVysledek(aktualniPriklad);
        tlacitko.textContent = 'START';
        zobrazitVysledek = false;
      }
    });

    naplnCislice();
    document.getElementById('operace').value = '+';
  </script>
</body>
</html>
