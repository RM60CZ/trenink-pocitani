<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trénink počítání</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      width: 95%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      color: #3498db;
      margin-top: 0;
      font-size: 1.8rem;
    }

    .controls {
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #34495e;
    }

    .label-top {
      font-weight: bold;
      color: #34495e;
      line-height: 1.3;
      font-size: 0.9rem;
    }

    .label-bottom {
      font-weight: bold;
      color: #34495e;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    select {
      padding: 8px 6px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      width: 60px;
    }

    #operace {
      width: 70px;
    }

    button {
      padding: 10px 14px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      min-width: 120px;
    }

    button:hover {
      background-color: #2980b9;
    }

    .priklad-oblast {
      margin: -25px auto 25px; /* JEŠTĚ VÝŠ: -25px nahoře */
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      width: fit-content;
    }

    .example,
    .cara,
    .result-line {
      font-family: monospace;
      font-size: 2.0rem;
      line-height: 1.4;
      white-space: pre;
    }

    .cara {
      color: #2c3e50;
      visibility: hidden;
    }

    .result-line {
      color: #27ae60;
      font-weight: bold;
      visibility: hidden;
    }

    .odpoved-input {
      margin-top: 12px;
      padding: 8px 10px;
      font-size: 1.4rem;
      font-family: monospace;
      width: 100%;
      max-width: 300px;
      text-align: right;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
      margin: 15px 0;
      min-height: 24px;
    }

    @media (max-width: 600px) {
      .example,
      .cara,
      .result-line,
      .odpoved-input {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trénink počítání</h1>

    <div class="controls">
      <div class="control-group">
        <label for="operace">Operace:</label>
        <select id="operace">
          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
      </div>

      <div class="control-group">
        <span class="label-top">Počet číslic</span>
        <span class="label-bottom">1. čísla:</span>
        <select id="cislice1"></select>
      </div>

      <div class="control-group">
        <span class="label-top">Počet číslic</span>
        <span class="label-bottom">2. čísla:</span>
        <select id="cislice2"></select>
      </div>
    </div>

    <div class="error" id="chyba"></div>

    <div class="priklad-oblast">
      <div class="example" id="priklad">Zatím žádný příklad</div>
      <div class="cara" id="cara"></div>
      <div class="result-line" id="vysledek"></div>
      <input type="text" id="odpoved" class="odpoved-input" placeholder="Tvá odpověď" autocomplete="off" />
    </div>

    <button id="tlacitko">START</button>
  </div>

  <script>
    function naplnCislice() {
      const sel1 = document.getElementById('cislice1');
      const sel2 = document.getElementById('cislice2');
      sel1.innerHTML = '';
      sel2.innerHTML = '';
      for (let i = 1; i <= 9; i++) {
        const opt1 = document.createElement('option');
        opt1.value = i;
        opt1.textContent = i;
        sel1.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = i;
        opt2.textContent = i;
        sel2.appendChild(opt2);
      }
      sel1.value = '2';
      sel2.value = '1';
    }

    function formatujCislo(cislo) {
      return cislo.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function generujCislo(pocetCislic) {
      const min = Math.pow(10, pocetCislic - 1);
      const max = Math.pow(10, pocetCislic) - 1;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let aktualniPriklad = null;

    function vygenerujPriklad() {
      const operace = document.getElementById('operace').value;
      const pocet1 = parseInt(document.getElementById('cislice1').value);
      const pocet2 = parseInt(document.getElementById('cislice2').value);

      const chybaEl = document.getElementById('chyba');
      chybaEl.textContent = '';

      if (operace === '-' && pocet1 < pocet2) {
        chybaEl.textContent = '❌ Nelze: 1. číslo má méně číslic → výsledek by byl záporný.';
        return null;
      }

      let cislo1, cislo2;
      let pokusy = 0;
      const MAX_POKUSU = 1000;

      while (pokusy < MAX_POKUSU) {
        pokusy++;
        cislo1 = generujCislo(pocet1);

        if (pocet2 === 1) {
          cislo2 = Math.floor(Math.random() * 8) + 2;
        } else {
          cislo2 = generujCislo(pocet2);
        }

        if (operace === '-' && cislo1 <= cislo2) continue;
        if (operace === '/' && cislo2 === 0) continue;

        break;
      }

      if (pokusy >= MAX_POKUSU) {
        chybaEl.textContent = '❌ Nepodařilo se vygenerovat platný příklad. Zkuste jinou kombinaci.';
        return null;
      }

      let vysledek;
      if (operace === '+') vysledek = cislo1 + cislo2;
      else if (operace === '-') vysledek = cislo1 - cislo2;
      else if (operace === '*') vysledek = BigInt(cislo1) * BigInt(cislo2);
      else if (operace === '/') vysledek = cislo1 / cislo2; // skutečné číslo pro porovnání

      return { cislo1, cislo2, operace, vysledek };
    }

    function spocitejMaxDelku(priklad) {
      const fVysledek = typeof priklad.vysledek === 'bigint'
        ? formatujCislo(priklad.vysledek)
        : (typeof priklad.vysledek === 'number'
            ? formatujCislo(Math.round(priklad.vysledek * 10000) / 10000)
            : priklad.vysledek.toString());

      return Math.max(
        formatujCislo(priklad.cislo1).length,
        (priklad.operace + ' ' + formatujCislo(priklad.cislo2)).length,
        fVysledek.length
      );
    }

    function zobrazPriklad(priklad) {
      const { cislo1, cislo2, operace } = priklad;
      const f1 = formatujCislo(cislo1);
      const f2 = formatujCislo(cislo2);

      const maxDelka = spocitejMaxDelku(priklad);
      const radek1 = f1.padStart(maxDelka);
      const radek2 = operace + ' ' + f2.padStart(maxDelka - 2);

      document.getElementById('priklad').textContent = radek1 + '\n' + radek2;

      const caraEl = document.getElementById('cara');
      caraEl.textContent = '─'.repeat(maxDelka);
      caraEl.style.visibility = 'hidden';

      const vysledekEl = document.getElementById('vysledek');
      vysledekEl.textContent = ' '.repeat(maxDelka);
      vysledekEl.style.visibility = 'hidden';

      // Vyčistit vstup a styl
      const input = document.getElementById('odpoved');
      input.value = '';
      input.style.backgroundColor = '';
      input.style.borderColor = '#ccc';
    }

    function normalizujOdpoved(odpoved, jeDeleni) {
      if (!jeDeleni) {
        // U +, -, * očekáváme celé číslo – odstraníme mezery a nečíselné znaky
        let ciste = odpoved.replace(/[^\d\-]/g, '');
        return ciste === '' ? NaN : BigInt(ciste || 0);
      } else {
        // U dělení: nahradíme čárku tečkou a parsovat jako float
        let normalized = odpoved.trim()
          .replace(/,/g, '.')          // čárka → tečka
          .replace(/[^\d.\-]/g, '');   // jen číslice, tečka, mínus
        return normalized === '' ? NaN : parseFloat(normalized);
      }
    }

    function porovnejOdpoved(zadano, skutecnyVysledek, jeDeleni) {
      if (jeDeleni) {
        const numZadano = zadano;
        const tolerance = 0.0001;
        return Math.abs(numZadano - skutecnyVysledek) < tolerance;
      } else {
        // Porovnání BigIntů
        try {
          return zadano === skutecnyVysledek;
        } catch {
          return false;
        }
      }
    }

    function zobrazVysledek(priklad) {
      const fVysledek = typeof priklad.vysledek === 'bigint'
        ? formatujCislo(priklad.vysledek)
        : (typeof priklad.vysledek === 'number'
            ? formatujCislo(Math.round(priklad.vysledek * 10000) / 10000)
            : priklad.vysledek.toString());

      const maxDelka = spocitejMaxDelku(priklad);

      const caraEl = document.getElementById('cara');
      caraEl.textContent = '─'.repeat(maxDelka);
      caraEl.style.visibility = 'visible';

      const vysledekEl = document.getElementById('vysledek');
      vysledekEl.textContent = fVysledek.padStart(maxDelka);
      vysledekEl.style.visibility = 'visible';
    }

    let zobrazitVysledek = false;

    document.getElementById('tlacitko').addEventListener('click', () => {
      const tlacitko = document.getElementById('tlacitko');
      const input = document.getElementById('odpoved');

      if (!zobrazitVysledek) {
        // Fáze: generování příkladu
        const priklad = vygenerujPriklad();
        if (!priklad) {
          tlacitko.textContent = 'START';
          zobrazitVysledek = false;
          return;
        }
        aktualniPriklad = priklad;
        zobrazPriklad(priklad);
        tlacitko.textContent = 'VÝSLEDEK';
        zobrazitVysledek = true;
        input.focus();
      } else {
        // Fáze: kontrola odpovědi
        const odpoved = input.value.trim();
        const jeDeleni = aktualniPriklad.operace === '/';

        if (odpoved === '') {
          input.style.backgroundColor = '#fff3cd';
          input.style.borderColor = '#ffc107';
          return;
        }

        const normalizovana = normalizujOdpoved(odpoved, jeDeleni);
        const jeSpravne = porovnejOdpoved(normalizovana, aktualniPriklad.vysledek, jeDeleni);

        if (jeSpravne) {
          input.style.backgroundColor = '#d4edda';
          input.style.borderColor = '#28a745';
        } else {
          input.style.backgroundColor = '#f8d7da';
          input.style.borderColor = '#dc3545';
        }

        // Zobrazit skutečný výsledek
        zobrazVysledek(aktualniPriklad);
        tlacitko.textContent = 'START';
        zobrazitVysledek = false;
      }
    });

    // Také povolit Enter v inputu
    document.getElementById('odpoved').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('tlacitko').click();
      }
    });

    naplnCislice();
    document.getElementById('operace').value = '+';
  </script>
</body>
</html>
