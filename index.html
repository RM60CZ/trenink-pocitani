<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trénink počítání</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      width: 95%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      color: #3498db;
      margin-top: 0;
      font-size: 1.8rem;
    }

    .controls {
      margin: 20px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #34495e;
    }

    .label-top {
      font-weight: bold;
      color: #34495e;
      line-height: 1.3;
      font-size: 0.9rem;
    }

    .label-bottom {
      font-weight: bold;
      color: #34495e;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    select {
      padding: 8px 6px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      width: 60px;
    }

    #operace {
      width: 70px;
    }

    button {
      padding: 10px 14px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      min-width: 120px;
    }

    button:hover {
      background-color: #2980b9;
    }

    .priklad-oblast {
      margin: 0 auto 15px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: fit-content;
    }

    .example,
    .cara,
    .result-line {
      font-family: monospace;
      font-size: 2.0rem;
      line-height: 1.4;
      white-space: pre;
      text-align: right;
    }

    .cara {
      color: #2c3e50;
      visibility: hidden;
    }

    .result-line {
      color: #27ae60;
      font-weight: bold;
      visibility: hidden;
    }

    .odpoved-oblast {
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .odpoved-oblast label {
      font-weight: normal;
      font-size: 1rem;
      color: #555;
    }

    #odpoved {
      padding: 10px;
      font-size: 1.2rem;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 8px;
      width: 180px;
      transition: border-color 0.3s, background-color 0.3s;
    }

    #odpoved.zelene {
      background-color: #d4edda;
      border-color: #28a745;
    }

    #odpoved.cervene {
      background-color: #f8d7da;
      border-color: #dc3545;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
      margin: 15px 0;
      min-height: 24px;
    }

    @media (max-width: 600px) {
      .example,
      .cara,
      .result-line {
        font-size: 1.6rem;
      }
      #odpoved {
        width: 150px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trénink počítání</h1>

    <div class="controls">
      <div class="control-group">
        <label for="operace">Operace:</label>
        <select id="operace">
          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
      </div>

      <div class="control-group">
        <span class="label-top">Počet číslic</span>
        <span class="label-bottom">1. čísla:</span>
        <select id="cislice1"></select>
      </div>

      <div class="control-group">
        <span class="label-top">Počet číslic</span>
        <span class="label-bottom">2. čísla:</span>
        <select id="cislice2"></select>
      </div>
    </div>

    <div class="error" id="chyba"></div>

    <div class="priklad-oblast">
      <div class="example" id="priklad">Zatím žádný příklad</div>
      <div class="cara" id="cara"></div>
      <div class="result-line" id="vysledek"></div>
    </div>

    <div class="odpoved-oblast">
      <label>Vaše odpověď:</label>
      <input type="text" id="odpoved" autocomplete="off" />
    </div>

    <button id="tlacitko">START</button>
  </div>

  <script>
    // ─── Pomocné funkce ───────────────────────────────────────
    function formatujCislo(cislo) {
      if (typeof cislo === 'bigint') {
        return cislo.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      }
      if (typeof cislo === 'number') {
        if (Number.isInteger(cislo)) {
          return cislo.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        } else {
          const [cela, desetinna] = cislo.toString().split('.');
          const celaFormatovana = cela.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
          return desetinna ? `${celaFormatovana}.${desetinna}` : celaFormatovana;
        }
      }
      return cislo.toString();
    }

    function normalizujOdpoved(vstup) {
      return vstup
        .trim()
        .replace(/\s+/g, '')   // odstraní všechny mezery
        .replace(',', '.');    // čárka → tečka
    }

    function generujCislo(pocetCislic) {
      const min = Math.pow(10, pocetCislic - 1);
      const max = Math.pow(10, pocetCislic) - 1;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // ─── Hlavní logika ────────────────────────────────────────
    let aktualniPriklad = null;
    let zobrazitVysledek = false;

    const el = {
      operace: document.getElementById('operace'),
      cislice1: document.getElementById('cislice1'),
      cislice2: document.getElementById('cislice2'),
      chyba: document.getElementById('chyba'),
      priklad: document.getElementById('priklad'),
      cara: document.getElementById('cara'),
      vysledek: document.getElementById('vysledek'),
      odpoved: document.getElementById('odpoved'),
      tlacitko: document.getElementById('tlacitko')
    };

    // Naplnění selectů
    function naplnCislice() {
      for (let i = 1; i <= 9; i++) {
        el.cislice1.innerHTML += `<option value="${i}">${i}</option>`;
        el.cislice2.innerHTML += `<option value="${i}">${i}</option>`;
      }
      el.cislice1.value = '2';
      el.cislice2.value = '1';
    }

    function vygenerujPriklad() {
      const operace = el.operace.value;
      const pocet1 = parseInt(el.cislice1.value);
      const pocet2 = parseInt(el.cislice2.value);

      el.chyba.textContent = '';

      if (operace === '-' && pocet1 < pocet2) {
        el.chyba.textContent = '❌ Nelze: 1. číslo má méně číslic → výsledek by byl záporný.';
        return null;
      }

      let cislo1, cislo2;
      let pokusy = 0;
      const MAX_POKUSU = 1000;

      while (pokusy < MAX_POKUSU) {
        pokusy++;
        cislo1 = generujCislo(pocet1);
        if (pocet2 === 1) {
          cislo2 = Math.floor(Math.random() * 8) + 2;
        } else {
          cislo2 = generujCislo(pocet2);
        }
        if (operace === '-' && cislo1 <= cislo2) continue;
        if (operace === '/' && cislo2 === 0) continue;
        break;
      }

      if (pokusy >= MAX_POKUSU) {
        el.chyba.textContent = '❌ Nepodařilo se vygenerovat platný příklad. Zkuste jinou kombinaci.';
        return null;
      }

      let vysledek;
      if (operace === '+') vysledek = cislo1 + cislo2;
      else if (operace === '-') vysledek = cislo1 - cislo2;
      else if (operace === '*') vysledek = BigInt(cislo1) * BigInt(cislo2);
      else if (operace === '/') vysledek = cislo1 / cislo2;

      return { cislo1, cislo2, operace, vysledek };
    }

    function spocitejMaxDelku(priklad) {
      const fVysledek = formatujCislo(priklad.vysledek);
      return Math.max(
        formatujCislo(priklad.cislo1).length,
        (priklad.operace + ' ' + formatujCislo(priklad.cislo2)).length,
        fVysledek.length
      );
    }

    function zobrazPriklad(priklad) {
      const { cislo1, cislo2, operace } = priklad;
      const f1 = formatujCislo(cislo1);
      const f2 = formatujCislo(cislo2);
      const maxDelka = spocitejMaxDelku(priklad);
      const radek1 = f1.padStart(maxDelka);
      const radek2 = operace + ' ' + f2.padStart(maxDelka - 2);
      el.priklad.textContent = radek1 + '\n' + radek2;

      el.cara.textContent = '─'.repeat(maxDelka);
      el.cara.style.visibility = 'hidden';
      el.vysledek.textContent = ' '.repeat(maxDelka);
      el.vysledek.style.visibility = 'hidden';
    }

    function zobrazVysledek(priklad) {
      const fVysledek = formatujCislo(priklad.vysledek);
      const maxDelka = spocitejMaxDelku(priklad);
      el.cara.style.visibility = 'visible';
      el.vysledek.textContent = fVysledek.padStart(maxDelka);
      el.vysledek.style.visibility = 'visible';
    }

    function porovnejOdpoved(uzivatelskaOdpoved, spravnyVysledek) {
      if (uzivatelskaOdpoved.trim() === '') return null;
      const normalizovana = normalizujOdpoved(uzivatelskaOdpoved);
      if (normalizovana === '') return false;

      if (typeof spravnyVysledek === 'bigint') {
        try {
          return BigInt(normalizovana) === spravnyVysledek;
        } catch {
          return false;
        }
      }

      if (typeof spravnyVysledek === 'number') {
        const uzivCislo = parseFloat(normalizovana);
        return !isNaN(uzivCislo) && Math.abs(uzivCislo - spravnyVysledek) < 1e-9;
      }
      return false;
    }

    // ─── Obsluha událostí ─────────────────────────────────────
    function handleTlacitko() {
      el.odpoved.classList.remove('zelene', 'cervene');

      if (!zobrazitVysledek) {
        const priklad = vygenerujPriklad();
        if (!priklad) {
          el.tlacitko.textContent = 'START';
          zobrazitVysledek = false;
          return;
        }
        aktualniPriklad = priklad;
        zobrazPriklad(priklad);
        el.odpoved.value = '';
        el.tlacitko.textContent = 'VÝSLEDEK';
        zobrazitVysledek = true;
        setTimeout(() => el.odpoved.focus(), 10);
      } else {
        const uzivOdpoved = el.odpoved.value;
        if (uzivOdpoved.trim() === '') {
          zobrazVysledek(aktualniPriklad);
        } else {
          const jeSpravne = porovnejOdpoved(uzivOdpoved, aktualniPriklad.vysledek);
          if (jeSpravne === true) {
            el.odpoved.classList.add('zelene');
          } else if (jeSpravne === false) {
            el.odpoved.classList.add('cervene');
          }
          zobrazVysledek(aktualniPriklad);
        }
        el.tlacitko.textContent = 'START';
        zobrazitVysledek = false;
      }
    }

    // Události
    el.tlacitko.addEventListener('click', handleTlacitko);

    // Enter na tlačítku START
    el.tlacitko.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleTlacitko();
      }
    });

    // Enter ve vstupním poli = VÝSLEDEK
    el.odpoved.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && zobrazitVysledek) {
        handleTlacitko();
      }
    });

    // Inicializace
    naplnCislice();
    el.operace.value = '+';
  </script>
</body>
</html>
