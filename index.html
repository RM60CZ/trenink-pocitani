<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oznámení</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
        }

        .card {
            background-color: #ffffff;
            border-left: 6px solid #3b82f6;
            border-radius: 10px;
            padding: 30px 40px;
            max-width: 600px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .message {
            font-size: 18px;
            color: #333333;
            line-height: 1.6;
        }

        .message a {
            color: #3b82f6;
            font-weight: bold;
            text-decoration: none;
            word-break: break-all;
        }

        .message a:hover {
            text-decoration: underline;
            color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">ℹ️</div>
        <p class="message">
            Prosím, změňte si přístupovou adresu na počítaní:<br><br>
            <a href="https://rm60cz.github.io/trenink/pocitani-zakladni" target="_blank">
                https://rm60cz.github.io/trenink/pocitani-zakladni
            </a>
        </p>
    </div>

</body>
</html>
