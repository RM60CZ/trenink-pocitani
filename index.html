<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trénink počítání</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            width: 95%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #3498db;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.8rem;
        }

        .controls {
            margin: 0 0 10px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-weight: bold;
            margin-bottom: 4px;
            color: #34495e;
        }

        .label-top {
            font-weight: bold;
            color: #34495e;
            line-height: 1.2;
            font-size: 0.85rem;
        }

        .label-bottom {
            font-weight: bold;
            color: #34495e;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        select {
            padding: 6px 4px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            width: 55px;
        }

        #operace {
            width: 60px;
        }

        .tlacitka {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        button {
            padding: 8px 14px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            min-width: 100px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            background-color: #1c6ea4;
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: default;
        }

        .priklad-oblast {
            margin: 10px auto 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
        }

        .example,
        .cara,
        .result-line {
            font-family: monospace;
            font-size: 2.0rem;
            line-height: 1.15;
            white-space: pre;
            text-align: right;
        }

        .cara {
            color: #2c3e50;
            visibility: hidden;
        }

        .result-line {
            color: #27ae60;
            font-weight: bold;
            visibility: hidden;
        }

        .odpoved-oblast {
            margin: 8px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #odpoved {
            padding: 8px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            width: 180px;
            transition: border-color 0.3s, background-color 0.3s;
            -webkit-appearance: none;
            appearance: none;
        }

        #odpoved.zelene {
            background-color: #d4edda;
            border-color: #28a745;
        }

        #odpoved.cervene {
            background-color: #f8d7da;
            border-color: #dc3545;
        }

        .napoveda {
            color: #7f8c8d;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
            margin: 0 0 8px 0;
            min-height: 0;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .example,
            .cara,
            .result-line {
                font-size: 1.6rem;
            }
            #odpoved {
                width: 150px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trénink počítání</h1>

        <div class="controls">
            <div class="control-group">
                <label for="operace">Operace:</label>
                <select id="operace">
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
            </div>

            <div class="control-group">
                <span class="label-top">Počet číslic</span>
                <span class="label-bottom">1. čísla:</span>
                <select id="cislice1"></select>
            </div>

            <div class="control-group">
                <span class="label-top">Počet číslic</span>
                <span class="label-bottom">2. čísla:</span>
                <select id="cislice2"></select>
            </div>
        </div>

        <div class="error" id="chyba"></div>

        <div class="priklad-oblast">
            <div class="example" id="priklad">Zatím žádný příklad</div>
            <div class="cara" id="cara"></div>
            <div class="result-line" id="vysledek"></div>
        </div>

        <div class="odpoved-oblast">
            <input type="text" id="odpoved" inputmode="decimal" autocomplete="off" />
            <div class="napoveda" id="napoveda"></div>
        </div>

        <div class="tlacitka">
            <button id="tlacitkoStart">START</button>
            <button id="tlacitkoVysledek" disabled>VÝSLEDEK</button>
        </div>
    </div>

    <script>
        // === Pomocné funkce ===
        function formatujCislo(x) {
            if (typeof x === 'bigint') {
                return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }
            if (typeof x !== 'number') return String(x);
            if (Number.isInteger(x)) {
                return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }
            const [cela, des] = x.toString().split('.');
            const celaFmt = cela.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return des ? `${celaFmt}.${des}` : celaFmt;
        }

        function normalizuj(vstup) {
            return vstup.trim().replace(/\s+/g, '').replace(',', '.');
        }

        function generujCislo(n) {
            const min = Math.pow(10, n - 1);
            const max = Math.pow(10, n) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // === Globální proměnné ===
        let aktualniPriklad = null;
        let prikladAktivni = false;

        // === DOM elementy ===
        const operaceEl = document.getElementById('operace');
        const cislice1El = document.getElementById('cislice1');
        const cislice2El = document.getElementById('cislice2');
        const chybaEl = document.getElementById('chyba');
        const prikladEl = document.getElementById('priklad');
        const caraEl = document.getElementById('cara');
        const vysledekEl = document.getElementById('vysledek');
        const odpovedEl = document.getElementById('odpoved');
        const napovedaEl = document.getElementById('napoveda');
        const tlacitkoStart = document.getElementById('tlacitkoStart');
        const tlacitkoVysledek = document.getElementById('tlacitkoVysledek');

        // === Naplnění selectů ===
        function naplnSelecty() {
            for (let i = 1; i <= 9; i++) {
                cislice1El.innerHTML += `<option value="${i}">${i}</option>`;
                cislice2El.innerHTML += `<option value="${i}">${i}</option>`;
            }
            cislice1El.value = '2';
            cislice2El.value = '1';
        }

        // === Generování příkladu ===
        function vygenerujPriklad() {
            const op = operaceEl.value;
            const n1 = parseInt(cislice1El.value);
            const n2 = parseInt(cislice2El.value);

            chybaEl.textContent = '';

            if (op === '-' && n1 < n2) {
                chybaEl.textContent = '❌ Nelze: 1. číslo má méně číslic → výsledek by byl záporný.';
                return null;
            }

            let a, b, pokusy = 0;
            while (pokusy < 1000) {
                pokusy++;
                a = generujCislo(n1);
                b = n2 === 1 ? Math.floor(Math.random() * 8) + 2 : generujCislo(n2);
                if (op === '-' && a <= b) continue;
                if (op === '/' && b === 0) continue;
                break;
            }

            if (pokusy >= 1000) {
                chybaEl.textContent = '❌ Nepodařilo se vygenerovat platný příklad.';
                return null;
            }

            let vysledek;
            if (op === '+') vysledek = a + b;
            else if (op === '-') vysledek = a - b;
            else if (op === '*') vysledek = BigInt(a) * BigInt(b);
            else if (op === '/') vysledek = a / b;

            return { a, b, op, vysledek };
        }

        // === Zobrazení příkladu ===
        function zobrazPriklad(p) {
            const fa = formatujCislo(p.a);
            const fb = formatujCislo(p.b);
            const fv = formatujCislo(p.vysledek);
            const max = Math.max(fa.length, (p.op + ' ' + fb).length, fv.length);

            prikladEl.textContent = `${fa.padStart(max)}\n${(p.op + ' ' + fb).padStart(max)}`;
            caraEl.textContent = '─'.repeat(max);
            caraEl.style.visibility = 'hidden';
            vysledekEl.textContent = ' '.repeat(max);
            vysledekEl.style.visibility = 'hidden';
        }

        // === Zobrazení výsledku ===
        function zobrazVysledek(p) {
            const fv = formatujCislo(p.vysledek);
            const max = Math.max(
                formatujCislo(p.a).length,
                (p.op + ' ' + formatujCislo(p.b)).length,
                fv.length
            );
            caraEl.style.visibility = 'visible';
            vysledekEl.textContent = fv.padStart(max);
            vysledekEl.style.visibility = 'visible';
        }

        // === AKCE: START ===
        function akceStart() {
            odpovedEl.classList.remove('zelene', 'cervene');

            const p = vygenerujPriklad();
            if (!p) {
                prikladAktivni = false;
                tlacitkoStart.disabled = false;
                tlacitkoVysledek.disabled = true;
                napovedaEl.textContent = '';
                return;
            }

            aktualniPriklad = p;
            zobrazPriklad(p);
            odpovedEl.value = '';
            prikladAktivni = true;

            tlacitkoStart.disabled = true;
            tlacitkoVysledek.disabled = false;
            napovedaEl.textContent = '⌨️ Zadej výsledek a stiskni Enter na klávesnici';

            // Dát fokus do pole -> otevře klávesnici
            setTimeout(function() {
                odpovedEl.focus();
                odpovedEl.click();
            }, 100);
        }

        // === AKCE: VÝSLEDEK ===
        function akceVysledek() {
            if (!prikladAktivni) return;

            const uziv = odpovedEl.value;
            const norm = normalizuj(uziv);

            if (norm === '') {
                zobrazVysledek(aktualniPriklad);
            } else {
                let spravne = false;
                const v = aktualniPriklad.vysledek;
                if (typeof v === 'bigint') {
                    try {
                        spravne = BigInt(norm) === v;
                    } catch {
                        spravne = false;
                    }
                } else if (typeof v === 'number') {
                    const num = parseFloat(norm);
                    spravne = !isNaN(num) && Math.abs(num - v) < 1e-9;
                }
                odpovedEl.classList.add(spravne ? 'zelene' : 'cervene');
                zobrazVysledek(aktualniPriklad);
            }

            prikladAktivni = false;
            tlacitkoStart.disabled = false;
            tlacitkoVysledek.disabled = true;
            napovedaEl.textContent = '✅ Stiskni START pro další příklad';

            // Necháme fokus na poli, klávesnice zůstane
            setTimeout(function() {
                odpovedEl.focus();
            }, 50);
        }

        // === Události ===

        // Tlačítko START
        tlacitkoStart.addEventListener('click', function(e) {
            e.preventDefault();
            akceStart();
        });

        // Tlačítko VÝSLEDEK
        tlacitkoVysledek.addEventListener('click', function(e) {
            e.preventDefault();
            akceVysledek();
        });

        // KLÍČOVÉ: Enter v poli = VÝSLEDEK
        odpovedEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (prikladAktivni) {
                    akceVysledek();
                }
            }
        });

        // Po VÝSLEDKU: pokud uživatel začne psát nové číslo,
        // automaticky spustit nový příklad
        odpovedEl.addEventListener('input', function() {
            if (!prikladAktivni && odpovedEl.value.length === 1) {
                // Uživatel začal psát -> automatický START
                akceStart();
                // Vrátit ten první znak
                const znak = odpovedEl.value;
                odpovedEl.value = znak;
            }
        });

        // === Inicializace ===
        naplnSelecty();
        operaceEl.value = '+';
        napovedaEl.textContent = '👆 Zmáčkni START pro vygenerování příkladu';
    </script>
</body>
</html>
