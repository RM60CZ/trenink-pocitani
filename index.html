<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Trénink počítání</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 { color: #3498db; margin-bottom: 15px; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 4px;
        }
        select {
            padding: 6px 8px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .priklad-oblast {
            margin: 20px 0;
            min-height: 120px;
        }
        .example, .cara, .result-line {
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            line-height: 1.1;
            white-space: pre;
            text-align: right;
        }
        .cara { color: #2c3e50; }
        .result-line { 
            font-weight: bold; 
            min-height: 2.2rem;
        }

        #odpoved {
            width: 160px;
            font-size: 1.6rem;
            padding: 12px;
            text-align: center;
            border: 3px solid #3498db;
            border-radius: 12px;
            outline: none;
            margin: 10px 0;
        }
        #odpoved.zelene { border-color: #28a745; background: #d4edda; }
        #odpoved.cervene { border-color: #dc3545; background: #f8d7da; }

        button {
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #3498db;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { background: #2980b9; }

        .error { color: #e74c3c; min-height: 24px; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trénink počítání</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Operace</label>
                <select id="operace">
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
            </div>
            <div class="control-group">
                <label>1. číslo (číslic)</label>
                <select id="cislice1"></select>
            </div>
            <div class="control-group">
                <label>2. číslo (číslic)</label>
                <select id="cislice2"></select>
            </div>
        </div>

        <div class="error" id="chyba"></div>

        <div class="priklad-oblast">
            <div class="example" id="priklad"></div>
            <div class="cara" id="cara"></div>
            <div class="result-line" id="vysledek"></div>
        </div>

        <input type="text" id="odpoved" inputmode="numeric" autocomplete="off">

        <button id="tlacitko">START</button>
    </div>

    <script>
        const operaceEl = document.getElementById('operace');
        const cislice1El = document.getElementById('cislice1');
        const cislice2El = document.getElementById('cislice2');
        const chybaEl = document.getElementById('chyba');
        const prikladEl = document.getElementById('priklad');
        const caraEl = document.getElementById('cara');
        const vysledekEl = document.getElementById('vysledek');
        const odpovedEl = document.getElementById('odpoved');
        const tlacitkoEl = document.getElementById('tlacitko');

        // Naplnění selectů
        for (let i = 1; i <= 9; i++) {
            cislice1El.innerHTML += `<option value="${i}">${i}</option>`;
            cislice2El.innerHTML += `<option value="${i}">${i}</option>`;
        }
        cislice1El.value = '2';
        cislice2El.value = '1';

        let aktualniPriklad = null;
        let jeHotovo = false;

        function nahodne(n) {
            const min = Math.pow(10, n - 1);
            const max = Math.pow(10, n) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generujPriklad() {
            const op = operaceEl.value;
            const n1 = parseInt(cislice1El.value);
            const n2 = parseInt(cislice2El.value);
            chybaEl.textContent = '';

            let a = nahodne(n1);
            let b = nahodne(n2);

            if (op === '-') {
                if (a < b) [a, b] = [b, a];
            }
            if (op === '/' && b === 0) b = nahodne(n2) || 1;

            let v;
            if (op === '+') v = a + b;
            else if (op === '-') v = a - b;
            else if (op === '*') v = a * b;
            else if (op === '/') v = a / b;

            return { a, b, op, v };
        }

        function zobrazPriklad(p) {
            const fa = p.a.toString();
            const fb = p.b.toString();
            const opZnak = p.op === '*' ? '×' : p.op === '/' ? '÷' : p.op;

            const maxLen = Math.max(fa.length, (opZnak + ' ' + fb).length);

            prikladEl.textContent = fa.padStart(maxLen) + '\n' + (opZnak + ' ' + fb).padStart(maxLen);
            caraEl.textContent = '─'.repeat(maxLen);
            vysledekEl.textContent = '';
            vysledekEl.style.display = 'none';
        }

        function novyPriklad() {
            aktualniPriklad = generujPriklad();
            zobrazPriklad(aktualniPriklad);
            odpovedEl.value = '';
            odpovedEl.className = '';
            jeHotovo = false;
            setTimeout(() => odpovedEl.focus(), 50);
        }

        function zkontrolujOdpoved() {
            if (!aktualniPriklad || jeHotovo) return;

            const vstup = odpovedEl.value.trim().replace(',', '.');
            if (vstup === '') return;

            const spravne = parseFloat(vstup) === parseFloat(aktualniPriklad.v);

            odpovedEl.className = spravne ? 'zelene' : 'cervene';
            vysledekEl.textContent = aktualniPriklad.v;
            vysledekEl.style.display = 'block';
            jeHotovo = true;

            // Po 800ms nový příklad
            setTimeout(() => {
                if (jeHotovo) novyPriklad();
            }, 800);
        }

        // === Ovládání ===
        tlacitkoEl.addEventListener('click', () => {
            if (!jeHotovo) {
                zkontrolujOdpoved();
            } else {
                novyPriklad();
            }
        });

        odpovedEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!jeHotovo) {
                    zkontrolujOdpoved();
                } else {
                    novyPriklad();
                }
            }
        });

        // START prvního příkladu
        tlacitkoEl.addEventListener('click', () => {
            if (!aktualniPriklad) {
                tlacitkoEl.textContent = "DALŠÍ";
                novyPriklad();
            }
        }, { once: true });

        // Inicializace
        prikladEl.textContent = 'Připraveno';
        caraEl.textContent = '';
    </script>
</body>
</html>
