<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>

<style>
*{margin:0;padding:0;box-sizing:border-box}
.zelene{background:#15803d!important;border-color:#22c55e!important;color:#fff!important}
.cervene{background:#b91c1c!important;border-color:#ef4444!important;color:#fff!important}
input{-webkit-appearance:none;border-radius:.75rem}
.math-text{white-space:pre;line-height:1.25;display:block;font-variant-numeric:tabular-nums}
.worksheet-bg{background-color:#e2e8f0;background-image:radial-gradient(circle,#94a3b8 1px,transparent 1px);background-size:24px 24px}
.dark .worksheet-bg{background-color:rgba(30,41,59,.4);background-image:radial-gradient(circle,#334155 1px,transparent 1px)}
.btn-pulse{animation:pulse-blue 2.5s infinite}
@keyframes pulse-blue{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 10px rgba(37,99,235,0)}}
.btn-glow{animation:glow 2.5s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
.shake{animation:shake .5s both}
@keyframes shake{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(2px,0,0)}30%,50%,70%{transform:translate3d(-3px,0,0)}40%,60%{transform:translate3d(3px,0,0)}}
.slide-up{animation:slideUp .3s forwards}
@keyframes slideUp{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.fade-in{animation:fadeIn .3s forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop .2s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.settings-panel{max-height:150px;opacity:1;overflow:hidden;transition:all .3s ease}
.settings-panel.collapsed{max-height:0;opacity:0;margin:0!important;pointer-events:none}
.scrollbar-hide::-webkit-scrollbar{display:none}
.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
.score-bar{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#micBtn{transition:all .2s;display:none}
#micBtn.visible{display:flex}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
#micBtn.listening{animation:mic-pulse 1.2s infinite;border-color:#ef4444!important}
#odpoved.mic-active{border-color:#ef4444!important;box-shadow:0 0 0 2px rgba(239,68,68,.25)}
</style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans">

      <span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">✓</span>

      <svg class="hidden dark:inline w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>

<script>
(function(){
// ==========================================================
// NASTAVENÍ POSUNU VÝSLEDKU (V PIXELECH)
// Zvětšením čísla posunete výsledek více DOLEVA.
// ==========================================================
const POSUN_VYSLEDKU_ZPRAVA_PX = 25;

const $=id=>document.getElementById(id);

const fmt=x=>{
  if(typeof x==='bigint')return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  if(typeof x!=='number')return String(x);
  if(Number.isInteger(x))return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  const[c,d]=x.toString().split('.');
  return d?c.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+d:c.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
};

function fmtInputStr(s){
  s=s.replace(/\s/g,'');
  const neg=s.startsWith('-');
  const abs=neg?s.slice(1):s;
  const[ip,dp]=abs.split('.');
  const r=ip.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return(neg?'-':'')+r+(dp!==undefined?','+dp:'');
}

const norm=s=>s.trim().replace(/\s+/g,'').replace(',','.');
const genNum=n=>{const mn=10**(n-1),mx=10**n-1;return Math.floor(Math.random()*(mx-mn+1))+mn};
const trunc4=n=>{const[c,d]=(n+'').split('.');return d?c+'.'+d.substring(0,4):c};

const KEY='matika_trenink_v4';
let correct=0,wrong=0,streak=0,history=[],aktualniPriklad=null,zobrazitVysledek=false,isProcessing=false;

const operaceEl=$('operace'),cis1=$('cislice1'),cis2=$('cislice2'),chybaEl=$('chyba');
const prikladEl=$('priklad'),caraEl=$('cara'),odpovedEl=$('odpoved'),btnEl=$('tlacitko');
const inputIcon=$('inputIcon'),enterHint=$('enterHint');
const scoreC=$('scoreCorrect'),scoreW=$('scoreWrong'),streakEl=$('streakCount');
const histCont=$('historyContainer'),histList=$('historyList'),histEmpty=$('historyEmpty');
const hlasCheck=$('hlasCheck'),micBtn=$('micBtn'),micLabel=$('micLabel');

// Aplikace posunu výsledku
odpovedEl.style.paddingRight = POSUN_VYSLEDKU_ZPRAVA_PX + 'px';

const today=new Date();
const czMonths=['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
const czDays=['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
$('currentDate').textContent=`${czDays[today.getDay()]} ${today.getDate()}. ${czMonths[today.getMonth()]} ${today.getFullYear()}`;
const todayStr=today.toISOString().slice(0,10);

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.date===todayStr){correct=s.correct||0;wrong=s.wrong||0;streak=s.streak||0;history=s.history||[]}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({date:todayStr,correct,wrong,streak,history}))}catch(e){}}
load();

for(let i=1;i<=9;i++){cis1.innerHTML+=`<option value="${i}">${i}</option>`;cis2.innerHTML+=`<option value="${i}">${i}</option>`}
cis1.value='2';cis2.value='1';

function updateCis2(){
  const op=operaceEl.value,v1=+cis1.value;
  [...cis2.options].forEach(o=>{o.disabled=(op==='-'&&+o.value>v1)});
  if(+cis2.value>v1&&op==='-')cis2.value=v1;
}
updateCis2();
operaceEl.addEventListener('change',()=>{updateCis2();chybaEl.textContent='';});
cis1.addEventListener('change',updateCis2);

function generate(){
  const op=operaceEl.value,n1=+cis1.value,n2=+cis2.value;
  chybaEl.textContent='';
  if(op==='-'&&n1<n2){chybaEl.textContent='❌ Při odčítání musí mít 1. číslo ≥ cifer než 2.';return null}
  let a,b,i=0;
  while(i++<1000){
    a=genNum(n1);b=n2===1?Math.floor(Math.random()*8)+2:genNum(n2);
    if(op==='-'&&a<=b)continue;if(op==='/'&&b===0)continue;break;
  }
  let vysledek,vysledekZ;
  if(op==='+'){vysledek=vysledekZ=a+b}
  else if(op==='-'){vysledek=vysledekZ=a-b}
  else if(op==='*'){vysledek=vysledekZ=BigInt(a)*BigInt(b)}
  else{vysledek=a/b;vysledekZ=trunc4(vysledek)}
  return{a,b,op,vysledek,vysledekZ};
}

function showProblem(p){
  const fa=fmt(p.a),fb=fmt(p.b);
  const max=Math.max(fa.length,(p.op+' '+fb).length);
  prikladEl.textContent=`${fa.padStart(max)}\n${(p.op+' '+fb).padStart(max)}`;
  caraEl.style.opacity='0';
}

function checkDivision(userStr,p){
  const n=norm(userStr);
  const trueStr=trunc4(p.vysledek);
  const[tc,td='']=trueStr.split('.');
  const[uc,ud='']=n.split('.');
  if(uc!==tc)return{ok:false,bracket:0};
  const correctDecLen=td.length;
  let userDec=ud;
  while(userDec.length>correctDecLen&&userDec.endsWith('0'))userDec=userDec.slice(0,-1);
  const truePadded=td.padEnd(Math.max(userDec.length,correctDecLen),'0');
  for(let i=0;i<userDec.length;i++){if(userDec[i]!==truePadded[i])return{ok:false,bracket:i+1}}
  return{ok:true,bracket:userDec.length};
}

function check(input,p){
  const n=norm(input);if(!n)return false;
  if(p.op==='/'){return checkDivision(input,p).ok}
  else if(typeof p.vysledek==='bigint'){try{return BigInt(n)===p.vysledek}catch{return false}}
  else{const num=parseFloat(n);return!isNaN(num)&&Math.abs(num-p.vysledek)<1e-9}
}

function findFirstWrongDigit(userInput,p){
  const n=norm(userInput);
  let cs,us;
  if(typeof p.vysledek==='bigint'){
    cs=p.vysledek.toString();
    try{us=BigInt(n).toString()}catch{return 1}
  }else{
    cs=String(p.vysledek);
    us=String(parseFloat(n));
  }
  const ml=Math.max(cs.length,us.length);
  for(let i=0;i<ml;i++){if((cs[i]||'')!==(us[i]||''))return i+1}
  return 0;
}

function updateScores(){
  scoreC.textContent=correct;scoreW.textContent=wrong;streakEl.textContent=streak;
  streakEl.parentElement.classList.add('pop');
  setTimeout(()=>streakEl.parentElement.classList.remove('pop'),200);
}

function updateBtn(){
  btnEl.classList.remove('btn-pulse','btn-glow');
  if(!zobrazitVysledek){btnEl.textContent='▶ '+(aktualniPriklad?'DALŠÍ PŘÍKLAD':'ZAČÍT');btnEl.classList.add('btn-pulse')}
  else{btnEl.textContent='✓ VÝSLEDEK(kontrola)';btnEl.classList.add('btn-glow')}
}

function renderHistory(){
  if(!history.length){histEmpty.style.display='block';histCont.style.opacity='0';histList.querySelectorAll('.hi').forEach(e=>e.remove());return}
  histEmpty.style.display='none';histCont.style.opacity='1';
  histList.querySelectorAll('.hi').forEach(e=>e.remove());
  history.forEach((h,i)=>{
    const d=document.createElement('div');
    d.className=`hi slide-up px-2.5 py-1 rounded-md text-[12px] tabular-nums font-bold border ${h.correct?'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300':'bg-rose-50 dark:bg-rose-900/20 border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300'}`;
    d.style.animationDelay=i*50+'ms';
    d.textContent=h.text+' '+(h.correct?'✓':'✗');
    histList.appendChild(d);
  });
}

function addHist(ok,userInput){
  if(!aktualniPriklad)return;
  const p=aktualniPriklad;
  const v=p.vysledekZ!==undefined?p.vysledekZ:p.vysledek;
  const opStr=p.op==='*'?'×':p.op==='/'?'÷':p.op;
  let bracketStr='';
  if(p.op==='/'){
    const r=checkDivision(userInput,p);
    bracketStr=`(${r.bracket})`;
  }else if(!ok){
    const pos=findFirstWrongDigit(userInput,p);
    if(pos>0)bracketStr=`(${pos})`;
  }
  const text=`${fmt(p.a)} ${opStr} ${fmt(p.b)} = ${fmt(v)}${bracketStr}`;
  history.unshift({text,correct:ok});
  renderHistory();
}

function handle(e,fromVoice){
  if(isProcessing)return;isProcessing=true;
  if(e)e.preventDefault();
  odpovedEl.classList.remove('zelene','cervene');
  inputIcon.style.opacity='0';
  
  if(!fromVoice&&micListening)stopMic(false);

  if(!zobrazitVysledek){
    if(!aktualniPriklad&&norm(odpovedEl.value)==='smazat'){history=[];correct=wrong=streak=0;updateScores();renderHistory();save()}
    const p=generate();if(!p){isProcessing=false;return}
    aktualniPriklad=p;showProblem(p);
    odpovedEl.value='';odpovedEl.placeholder='Váš výsledek';
    spReset();
    zobrazitVysledek=true;updateBtn();
    updateMicVisibility();
    setTimeout(()=>{
      caraEl.style.opacity='1';
      if(hlasCheck.checked){setTimeout(()=>startMic(),100)}
      else{odpovedEl.focus()}
      isProcessing=false;
    },50);
  }else{
    const val=odpovedEl.value.trim();
    const normVal=norm(val);
    if(!val){
      odpovedEl.value=fmt(aktualniPriklad.vysledekZ!==undefined?aktualniPriklad.vysledekZ:aktualniPriklad.vysledek);
      zobrazitVysledek=false;updateBtn();
      updateMicVisibility();
      setTimeout(()=>{odpovedEl.focus();isProcessing=false},50);
    }else if(!/^-?\d+([.,]\d*)?$/.test(normVal)){
      chybaEl.textContent='⚠️ Nepovolený znak!';isProcessing=false;
      if(!fromVoice)odpovedEl.focus();
    }else{
      odpovedEl.value=fmtInputStr(normVal);
      let ok;
      if(aktualniPriklad.op==='/'){
        ok=checkDivision(normVal,aktualniPriklad).ok;
      }else{
        ok=check(normVal,aktualniPriklad);
      }
      odpovedEl.classList.add(ok?'zelene':'cervene');
      if(ok){correct++;streak++;inputIcon.innerHTML='<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>'}
      else{
        wrong++;streak=0;
        inputIcon.innerHTML='<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg>';
        odpovedEl.classList.add('shake');
        setTimeout(()=>odpovedEl.classList.remove('shake'),500);
      }
      inputIcon.style.opacity='1';
      updateScores();addHist(ok,normVal);save();
      zobrazitVysledek=false;updateBtn();
      updateMicVisibility();
      setTimeout(()=>isProcessing=false,150);
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// HLASOVÝ VSTUP (Kompletní a robustní verze)
// ═══════════════════════════════════════════════════════════════

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,micListening=false,micAutoRestart=true;

let spBufInt='';   
let spBufDec='';   
let spDecMode=false; 

function spReset(){
  spBufInt='';
  spBufDec='';
  spDecMode=false;
  odpovedEl.value='';
}

function spFlush(){
  let raw = spBufInt;
  if (!raw && !spDecMode) return;
  if (!raw) raw = '0';
  if (spDecMode) raw += '.' + (spBufDec || '0');
  odpovedEl.value = fmtInputStr(raw);
}

const WV={
  'žádná':0,'zadna':0,
  'nula':0,'nulu':0,'nuly':0,
  'jedna':1,'jeden':1,'jedno':1,'jednu':1,'jedné':1,
  'dvě':2,'dva':2,'dvou':2,
  'tři':3,'třech':3,
  'čtyři':4,'čtyřech':4,
  'pět':5,'pěti':5,
  'šest':6,'šesti':6,
  'sedm':7,'sedmi':7,
  'osm':8,'osmi':8,
  'devět':9,'devíti':9,
  'deset':10,'deseti':10,
  'jedenáct':11,'jedenácti':11,
  'dvanáct':12,'dvanácti':12,
  'třináct':13,'třinácti':13,
  'čtrnáct':14,'čtrnácti':14,
  'patnáct':15,'patnácti':15,
  'šestnáct':16,'šestnácti':16,
  'sedmnáct':17,'sedmnácti':17,
  'osmnáct':18,'osmnácti':18,
  'devatenáct':19,'devatenácti':19,
  'dvacet':20,'dvaceti':20,
  'třicet':30,'třiceti':30,
  'čtyřicet':40,'čtyřiceti':40,
  'padesát':50,'padesáti':50,
  'šedesát':60,'šedesáti':60,
  'sedmdesát':70,'sedmdesáti':70,
  'osmdesát':80,'osmdesáti':80,
  'devadesát':90,'devadesáti':90,
  'sto':100,'sta':100,'stu':100,'stem':100,'stě':100,
  'dvěstě':200,'dvěsta':200,
  'třista':300,'třísta':300,
  'čtyřista':400,'čtyřsta':400,
};

const IGNORE_WORDS=new Set([
  'tisíc','tisíce','tisíců','tisíci','tisícům','tisícem','tisících',
  'milion','milión','miliony','milióny','milionu','miliónu','milionů','miliónů',
  'miliarda','miliardy','miliard','miliardě','miliardám','miliardou','miliardách',
]);

const DEC_RE=/(?:^|\s)(celá|celé|celých|celych|cely|celi|cela|čárka|čárku|carka|carku|tečka|tečku|tecka|tecku)(?:\s|$)/;

function parseVoiceTokens(words){
  const result=[]; 
  let i=0;
  while(i<words.length){
    const w=words[i];
    if(!w){i++;continue;}
    if(IGNORE_WORDS.has(w)){i++;continue;}

    let matched=false;
    for(let len=4;len>=1;len--){
      if(i+len>words.length)continue;
      const phrase=words.slice(i,i+len).join(' ');
      const val=evalPhrase(phrase,words,i,len);
      if(val!==null){
        if((typeof val==='number'&&val>=0)||(typeof val==='string'&&/^\d+$/.test(val))){
          result.push(val);
          i+=len;
          matched=true;
          break;
        }
      }
    }
    if(!matched)i++;
  }
  return result;
}

function evalPhrase(phrase, words, startIdx, len) {
  if (/^\d+$/.test(phrase)) return phrase; 
  if (WV[phrase] !== undefined) return WV[phrase];

  if (len >= 2) {
    const w0 = words[startIdx], w1 = words[startIdx+1];
    if ((w1==='set'||w1==='sto'||w1==='sta'||w1==='stu'||w1==='stě') && WV[w0] !== undefined && WV[w0] >= 2 && WV[w0] <= 9) {
      return WV[w0]*100;
    }
    if (WV[w0] !== undefined && WV[w0] >= 20 && WV[w0] <= 90 && WV[w1] !== undefined && WV[w1] >= 1 && WV[w1] <= 9) {
      return WV[w0] + WV[w1];
    }
    if (w0==='sto' || w0==='sta' || w0==='stu' || w0==='stě') {
      if (WV[w1] !== undefined && WV[w1] <= 99) return 100 + WV[w1];
      if (/^\d+$/.test(w1)) return 100 + parseInt(w1, 10);
    }
  }
  if (len >= 3) {
    const w0 = words[startIdx], w1 = words[startIdx+1], w2 = words[startIdx+2];
    const isHundred = (w1==='set'||w1==='sto'||w1==='sta'||w1==='stu'||w1==='stě') && WV[w0] >= 2 && WV[w0] <= 9;
    if (isHundred) {
      const hundreds = WV[w0] * 100;
      if (len === 3) {
        if (WV[w2] !== undefined && WV[w2] <= 99) return hundreds + WV[w2];
        if (/^\d+$/.test(w2)) return hundreds + parseInt(w2, 10);
      }
      if (len === 4) {
        const w3 = words[startIdx+3];
        if (WV[w2] !== undefined && WV[w2] >= 20 && WV[w2] <= 90 && WV[w3] !== undefined && WV[w3] >= 1 && WV[w3] <= 9) {
          return hundreds + WV[w2] + WV[w3];
        }
      }
    }
    if (w0==='sto' || w0==='sta' || w0==='stu' || w0==='stě') {
      if (len === 3) {
        if (WV[w1] !== undefined && WV[w1] >= 20 && WV[w1] <= 90 && WV[w2] !== undefined && WV[w2] >= 1 && WV[w2] <= 9) {
          return 100 + WV[w1] + WV[w2];
        }
      }
    }
  }
  return null;
}

function expandCompound(t){
  return t.replace(/dvěstě/g,'dvě stě').replace(/třista/g,'tři sta').replace(/čtyřista/g,'čtyři sta')
     .replace(/([a-záčďéěíňóřšťúůýž]+)set\b/g,'$1 set')
     .replace(/(dvacet|třicet|čtyřicet|padesát|šedesát|sedmdesát|osmdesát|devadesát)(jedna|jeden|dvě|dva|tři|čtyři|pět|šest|sedm|osm|devět)/g,'$1 $2');
}

function updateMicVisibility(){
  const show=hlasCheck.checked&&zobrazitVysledek&&aktualniPriklad;
  micBtn.style.display=show?'flex':'none';
  if(!show&&micListening)stopMic(false);
}

function buildRecognition(){
  if(!SpeechRecognition)return null;
  const r=new SpeechRecognition();
  r.lang='cs-CZ';
  r.continuous=true;
  r.interimResults=false; 
  r.maxAlternatives=1;

  r.onstart=()=>{
    micListening=true;
    micBtn.classList.add('listening');
    micLabel.textContent='Poslouchám…';
    odpovedEl.classList.add('mic-active');
  };

  r.onend=()=>{
    micListening=false;
    micBtn.classList.remove('listening');
    micLabel.textContent='Mikrofon';
    odpovedEl.classList.remove('mic-active');
    if(micAutoRestart&&hlasCheck.checked&&zobrazitVysledek){
      setTimeout(()=>{if(!micListening&&hlasCheck.checked&&zobrazitVysledek)r.start()},300);
    }
  };

  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-available'){
      micAutoRestart=false;hlasCheck.checked=false;updateMicVisibility();
      chybaEl.textContent='⚠️ Mikrofon není dostupný';
    }
    micListening=false;
  };

  r.onresult=e=>{
    let finalText='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) finalText+=e.results[i][0].transcript+' ';
    }
    if(!finalText.trim())return;

    let raw = finalText.trim().toLowerCase();

    // Předzpracování chyb Googlu a formátování
    raw = raw.replace(/(\d)\s+(?=\d)/g, '$1');
    raw = raw.replace(/[,.]/g, ' čárka ');
    raw = raw.replace(/[?!;:_]/g, '');
    raw = raw.replace(/\b(ukázat|ukazat|ukažte|ukazte|ukaž|ukaš)\b/g, ' ');

    // -------------------------------------------------------------
    // ZDE JE PŘIDÁNA OPRAVA: slovo "nuly" se ihned přemění na "nula nula nula" (000)
    // -------------------------------------------------------------
    raw = raw.replace(/\bnuly\b/g, ' nula nula nula ');

    if(/znovu|znova|smazat|vymazat|zrušit|zrusit/.test(raw)){
      spReset();
      return;
    }

    let shouldShowAndStop = false;
    if(/\b(ano|jo|joo)\b/.test(raw)){
      shouldShowAndStop = true;
      raw = raw.replace(/\b(ano|jo|joo)\b/g, ' ');
    }

    raw = expandCompound(raw);
    raw = raw.trim();

    if(raw) {
      const match = raw.match(DEC_RE);
      if(match){
        const sepIdx = match.index;
        const before = raw.slice(0, sepIdx).trim();
        const after = raw.slice(sepIdx + match[0].length).trim();

        if(before){
          const words = before.split(/\s+/).filter(Boolean);
          parseVoiceTokens(words).forEach(v => { spBufInt += String(v) });
        }
        
        spDecMode=true;

        if(after){
          const words = after.split(/\s+/).filter(Boolean);
          parseVoiceTokens(words).forEach(v => { spBufDec += String(v) });
        }
      } else if (spDecMode) {
        const words = raw.split(/\s+/).filter(Boolean);
        parseVoiceTokens(words).forEach(v => { spBufDec += String(v) });
      } else {
        const words = raw.split(/\s+/).filter(Boolean);
        parseVoiceTokens(words).forEach(v => { spBufInt += String(v) });
      }
    }

    if (shouldShowAndStop) {
      spFlush(); 
      micAutoRestart = false; 
      stopMic(false); 
    }
  };

  return r;
}

function startMic(){
  if(!SpeechRecognition){chybaEl.textContent='⚠️ Prohlížeč nepodporuje hlasový vstup';return}
  if(micListening)return;
  micAutoRestart=true;
  if(!recognition)recognition=buildRecognition();
  try{recognition.start()}catch(e){}
}

function stopMic(reset){
  micAutoRestart=false;
  if(recognition&&micListening){try{recognition.stop()}catch(e){}}
  if(reset){recognition=null}
  micListening=false;
  micBtn.classList.remove('listening');
  micLabel.textContent='Mikrofon';
  odpovedEl.classList.remove('mic-active');
}

hlasCheck.addEventListener('change',()=>{
  updateMicVisibility();
  if(!hlasCheck.checked){stopMic(true)}
  else if(zobrazitVysledek&&aktualniPriklad){setTimeout(()=>startMic(),100)}
});

micBtn.addEventListener('click',()=>{if(micListening)stopMic(false);else startMic()});
micBtn.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});

btnEl.addEventListener('touchstart',e=>handle(e,false),{passive:false});
btnEl.addEventListener('click',e=>{if(e.pointerType!=='touch')handle(e,false)});
odpovedEl.addEventListener('keydown',e=>{if(e.key==='Enter')handle(e,false)});
odpovedEl.addEventListener('focus',()=>{if(zobrazitVysledek)enterHint.style.opacity='1'});
odpovedEl.addEventListener('blur',()=>enterHint.style.opacity='0');
odpovedEl.addEventListener('input',()=>{if(odpovedEl.value)enterHint.style.opacity='0'});
$('settingsToggle').addEventListener('click',()=>{$('settingsPanel').classList.toggle('collapsed')});

new MutationObserver(()=>{if(chybaEl.textContent.trim())$('settingsPanel').classList.remove('collapsed')}).observe(chybaEl,{childList:true});
new MutationObserver(()=>{const t=prikladEl.textContent;if(t&&!t.includes('Zvolte')){prikladEl.classList.remove('fade-in');void prikladEl.offsetWidth;prikladEl.classList.add('fade-in')}}).observe(prikladEl,{childList:true});

updateScores();updateBtn();renderHistory();updateMicVisibility();
setTimeout(()=>odpovedEl.focus(),100);
})();
</script>
