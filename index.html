<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trénink počítání</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2d2d3a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #3a3a4a;
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            width: 95%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #5dade2;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.8rem;
        }

        .controls {
            margin: 0 0 10px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-weight: bold;
            margin-bottom: 4px;
            color: #b0b0c0;
        }

        .label-top {
            font-weight: bold;
            color: #b0b0c0;
            line-height: 1.2;
            font-size: 0.85rem;
        }

        .label-bottom {
            font-weight: bold;
            color: #b0b0c0;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        select {
            padding: 6px 4px;
            font-size: 1rem;
            border: 1px solid #5a5a6a;
            border-radius: 8px;
            background: #2d2d3a;
            color: #e0e0e0;
            width: 55px;
        }

        #operace {
            width: 60px;
        }

        .tlacitka {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        button {
            padding: 8px 14px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #5dade2;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            min-width: 120px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        button:hover {
            background-color: #4a9cd4;
        }

        button:active {
            background-color: #3a8cc4;
        }

        button:disabled {
            background-color: #5a5a6a;
            color: #8a8a9a;
            cursor: default;
        }

        .priklad-oblast {
            margin: 10px auto 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
        }

        .example,
        .cara,
        .result-line {
            font-family: monospace;
            font-size: 2.0rem;
            line-height: 1.15;
            white-space: pre;
            text-align: right;
            color: #e8e8f0;
        }

        .cara {
            color: #8a8a9a;
            visibility: hidden;
        }

        .result-line {
            color: #58d68d;
            font-weight: bold;
            visibility: hidden;
        }

        .odpoved-oblast {
            margin: 8px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #odpoved {
            padding: 8px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #5a5a6a;
            border-radius: 8px;
            width: 180px;
            transition: border-color 0.3s, background-color 0.3s;
            background: #2d2d3a;
            color: #e0e0e0;
            -webkit-appearance: none;
            appearance: none;
        }

        #odpoved:read-only {
            background-color: #353545;
            color: #a0a0b0;
            cursor: default;
            border-color: #4a4a5a;
        }

        #odpoved.zelene {
            background-color: #1a3a2a;
            border-color: #58d68d;
            color: #e0e0e0;
        }

        #odpoved.cervene {
            background-color: #3a1a1a;
            border-color: #e74c3c;
            color: #e0e0e0;
        }

        /* Zachovat barvu i v readonly */
        #odpoved.zelene:read-only {
            background-color: #1a3a2a;
            border-color: #58d68d;
            color: #a0a0b0;
        }

        #odpoved.cervene:read-only {
            background-color: #3a1a1a;
            border-color: #e74c3c;
            color: #a0a0b0;
        }

        .napoveda {
            color: #8a8a9a;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
            margin: 0 0 8px 0;
            min-height: 0;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .example,
            .cara,
            .result-line {
                font-size: 1.6rem;
            }
            #odpoved {
                width: 150px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trénink počítání</h1>

        <div class="controls">
            <div class="control-group">
                <label for="operace">Operace:</label>
                <select id="operace">
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
            </div>

            <div class="control-group">
                <span class="label-top">Počet číslic</span>
                <span class="label-bottom">1. čísla:</span>
                <select id="cislice1"></select>
            </div>

            <div class="control-group">
                <span class="label-top">Počet číslic</span>
                <span class="label-bottom">2. čísla:</span>
                <select id="cislice2"></select>
            </div>
        </div>

        <div class="error" id="chyba"></div>

        <div class="priklad-oblast">
            <div class="example" id="priklad">Zatím žádný příklad</div>
            <div class="cara" id="cara"></div>
            <div class="result-line" id="vysledek"></div>
        </div>

        <div class="odpoved-oblast">
            <input type="text" id="odpoved" inputmode="decimal" autocomplete="off" />
            <div class="napoveda" id="napoveda">👆 Zmáčkni START pro vygenerování příkladu</div>
        </div>

        <div class="tlacitka">
            <button id="tlacitkoDesktop">START</button>
            <button id="tlacitkoStartMobil" style="display: none;">START</button>
            <button id="tlacitkoVysledekMobil" style="display: none;" disabled>VÝSLEDEK</button>
        </div>
    </div>

    <script>
        // === Detekce mobilu ===
        function jeMobil() {
            return /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) ||
                   ('ontouchstart' in window && window.innerWidth < 768);
        }

        const mobil = jeMobil();

        // === Pomocné funkce ===
        function formatujCislo(x) {
            if (typeof x === 'bigint') {
                return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }
            if (typeof x !== 'number') return String(x);
            if (Number.isInteger(x)) {
                return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }
            const [cela, des] = x.toString().split('.');
            const celaFmt = cela.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return des ? `${celaFmt}.${des}` : celaFmt;
        }

        function normalizuj(vstup) {
            return vstup.trim().replace(/\s+/g, '').replace(',', '.');
        }

        function generujCislo(n) {
            const min = Math.pow(10, n - 1);
            const max = Math.pow(10, n) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // === Globální proměnné ===
        let aktualniPriklad = null;
        let prikladAktivni = false;

        // === DOM elementy ===
        const operaceEl = document.getElementById('operace');
        const cislice1El = document.getElementById('cislice1');
        const cislice2El = document.getElementById('cislice2');
        const chybaEl = document.getElementById('chyba');
        const prikladEl = document.getElementById('priklad');
        const caraEl = document.getElementById('cara');
        const vysledekEl = document.getElementById('vysledek');
        const odpovedEl = document.getElementById('odpoved');
        const napovedaEl = document.getElementById('napoveda');
        const tlacitkoDesktop = document.getElementById('tlacitkoDesktop');
        const tlacitkoStartMobil = document.getElementById('tlacitkoStartMobil');
        const tlacitkoVysledekMobil = document.getElementById('tlacitkoVysledekMobil');

        // === Nastavení tlačítek podle zařízení ===
        if (mobil) {
            tlacitkoDesktop.style.display = 'none';
            tlacitkoStartMobil.style.display = 'inline-block';
            tlacitkoVysledekMobil.style.display = 'inline-block';
        } else {
            tlacitkoDesktop.style.display = 'inline-block';
            tlacitkoStartMobil.style.display = 'none';
            tlacitkoVysledekMobil.style.display = 'none';
        }

        // === Naplnění selectů ===
        function naplnSelecty() {
            for (let i = 1; i <= 9; i++) {
                cislice1El.innerHTML += `<option value="${i}">${i}</option>`;
                cislice2El.innerHTML += `<option value="${i}">${i}</option>`;
            }
            cislice1El.value = '2';
            cislice2El.value = '1';
        }

        // === Generování příkladu ===
        function vygenerujPriklad() {
            const op = operaceEl.value;
            const n1 = parseInt(cislice1El.value);
            const n2 = parseInt(cislice2El.value);

            chybaEl.textContent = '';

            if (op === '-' && n1 < n2) {
                chybaEl.textContent = '❌ Nelze: 1. číslo má méně číslic → výsledek by byl záporný.';
                return null;
            }

            let a, b, pokusy = 0;
            while (pokusy < 1000) {
                pokusy++;
                a = generujCislo(n1);
                b = n2 === 1 ? Math.floor(Math.random() * 8) + 2 : generujCislo(n2);
                if (op === '-' && a <= b) continue;
                if (op === '/' && b === 0) continue;
                break;
            }

            if (pokusy >= 1000) {
                chybaEl.textContent = '❌ Nepodařilo se vygenerovat platný příklad.';
                return null;
            }

            let vysledek;
            if (op === '+') vysledek = a + b;
            else if (op === '-') vysledek = a - b;
            else if (op === '*') vysledek = BigInt(a) * BigInt(b);
            else if (op === '/') vysledek = a / b;

            return { a, b, op, vysledek };
        }

        // === Zobrazení příkladu ===
        function zobrazPriklad(p) {
            const fa = formatujCislo(p.a);
            const fb = formatujCislo(p.b);
            const fv = formatujCislo(p.vysledek);
            const max = Math.max(fa.length, (p.op + ' ' + fb).length, fv.length);

            prikladEl.textContent = `${fa.padStart(max)}\n${(p.op + ' ' + fb).padStart(max)}`;
            caraEl.textContent = '─'.repeat(max);
            caraEl.style.visibility = 'hidden';
            vysledekEl.textContent = ' '.repeat(max);
            vysledekEl.style.visibility = 'hidden';
        }

        // === Zobrazení výsledku ===
        function zobrazVysledek(p) {
            const fv = formatujCislo(p.vysledek);
            const max = Math.max(
                formatujCislo(p.a).length,
                (p.op + ' ' + formatujCislo(p.b)).length,
                fv.length
            );
            caraEl.style.visibility = 'visible';
            vysledekEl.textContent = fv.padStart(max);
            vysledekEl.style.visibility = 'visible';
        }

        // === Aktualizace UI tlačítek a zámku pole ===
        function aktualizujUI() {
            if (prikladAktivni) {
                // Jsme v režimu VÝSLEDEK -> pole odemknuté
                odpovedEl.readOnly = false;

                if (mobil) {
                    tlacitkoStartMobil.disabled = true;
                    tlacitkoVysledekMobil.disabled = false;
                } else {
                    tlacitkoDesktop.textContent = 'VÝSLEDEK';
                    tlacitkoDesktop.disabled = false;
                }
            } else {
                // Jsme v režimu START -> pole zamknuté, ale hodnota zůstává
                odpovedEl.readOnly = true;

                if (mobil) {
                    tlacitkoStartMobil.disabled = false;
                    tlacitkoVysledekMobil.disabled = true;
                } else {
                    tlacitkoDesktop.textContent = 'START';
                    tlacitkoDesktop.disabled = false;
                }
            }
        }

        // === AKCE: START ===
        function akceStart() {
            // Při STARTu NEsmažeme hodnotu - zůstane vidět
            // Odstraníme jen obarvení, pokud tam bylo
            odpovedEl.classList.remove('zelene', 'cervene');

            const p = vygenerujPriklad();
            if (!p) {
                prikladAktivni = false;
                aktualizujUI();
                napovedaEl.textContent = '👆 Zmáčkni START pro vygenerování příkladu';
                return;
            }

            aktualniPriklad = p;
            zobrazPriklad(p);

            // Vyčistíme pole pro nový příklad
            odpovedEl.value = '';

            prikladAktivni = true;
            aktualizujUI();

            if (mobil) {
                napovedaEl.textContent = '⌨️ Zadej výsledek a stiskni Enter na klávesnici';
            } else {
                napovedaEl.textContent = 'Zadej výsledek a stiskni Enter nebo VÝSLEDEK';
            }

            // Fokus do pole
            setTimeout(function() {
                odpovedEl.focus();
            }, 50);
        }

        // === AKCE: VÝSLEDEK ===
        function akceVysledek() {
            if (!prikladAktivni) return;

            const uziv = odpovedEl.value;
            const norm = normalizuj(uziv);

            if (norm === '') {
                zobrazVysledek(aktualniPriklad);
            } else {
                let spravne = false;
                const v = aktualniPriklad.vysledek;
                if (typeof v === 'bigint') {
                    try {
                        spravne = BigInt(norm) === v;
                    } catch {
                        spravne = false;
                    }
                } else if (typeof v === 'number') {
                    const num = parseFloat(norm);
                    spravne = !isNaN(num) && Math.abs(num - v) < 1e-9;
                }
                odpovedEl.classList.add(spravne ? 'zelene' : 'cervene');
                zobrazVysledek(aktualniPriklad);
            }

            prikladAktivni = false;
            aktualizujUI();
            napovedaEl.textContent = '✅ Stiskni START pro další příklad';

            // Fokus zůstane na poli (je readonly, hodnota vidět)
            setTimeout(function() {
                odpovedEl.focus();
            }, 50);
        }

        // === Události ===

        // Desktop tlačítko
        tlacitkoDesktop.addEventListener('click', function(e) {
            e.preventDefault();
            if (prikladAktivni) {
                akceVysledek();
            } else {
                akceStart();
            }
        });

        // Mobil tlačítko START
        tlacitkoStartMobil.addEventListener('click', function(e) {
            e.preventDefault();
            akceStart();
        });

        // Mobil tlačítko VÝSLEDEK
        tlacitkoVysledekMobil.addEventListener('click', function(e) {
            e.preventDefault();
            akceVysledek();
        });

        // Enter v poli = VÝSLEDEK
        odpovedEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (prikladAktivni) {
                    akceVysledek();
                }
            }
        });

        // Zamezit psaní do readonly pole i přes jiné cesty
        odpovedEl.addEventListener('keydown', function(e) {
            if (odpovedEl.readOnly && e.key !== 'Tab') {
                e.preventDefault();
            }
        });

        odpovedEl.addEventListener('paste', function(e) {
            if (odpovedEl.readOnly) {
                e.preventDefault();
            }
        });

        odpovedEl.addEventListener('input', function() {
            if (odpovedEl.readOnly) {
                // Pro jistotu - pokud se něco propašuje
                odpovedEl.value = odpovedEl._posledniHodnota || '';
            }
        });

        // === Inicializace ===
        naplnSelecty();
        operaceEl.value = '+';

        // Výchozí stav: pole zamknuté
        odpovedEl.readOnly = true;

        // Na mobilu hned fokus -> otevře číselnou klávesnici
        if (mobil) {
            setTimeout(function() {
                odpovedEl.focus();
            }, 300);
        }
    </script>
</body>
</html>
