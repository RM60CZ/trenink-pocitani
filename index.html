<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Trénink počítání</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      background: white;
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      color: #3498db;
      margin: 0 0 10px;
      font-size: 1.5rem;
    }

    .controls {
      margin: 0 0 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    label {
      font-weight: bold;
      margin-bottom: 2px;
      color: #34495e;
      font-size: 0.8rem;
    }

    .label-top {
      font-weight: bold;
      color: #34495e;
      font-size: 0.75rem;
      line-height: 1.1;
    }

    .label-bottom {
      font-weight: bold;
      color: #34495e;
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    select {
      padding: 5px 3px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      width: 50px;
    }

    #operace {
      width: 55px;
    }

    button {
      padding: 12px 20px;
      font-size: 1.1rem;
      border: none;
      border-radius: 10px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      font-weight: bold;
      min-width: 130px;
      margin-top: 8px;
    }

    button:active {
      background-color: #2980b9;
    }

    .priklad-oblast {
      margin: 8px auto 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .example,
    .cara,
    .result-line {
      font-family: 'Courier New', monospace;
      font-size: 1.8rem;
      line-height: 1.2;
      white-space: pre;
      text-align: right;
    }

    .cara {
      color: #2c3e50;
    }

    .result-line {
      color: #27ae60;
      font-weight: bold;
    }

    .odpoved-oblast {
      margin: 6px 0 0;
    }

    #odpoved {
      padding: 10px;
      font-size: 1.3rem;
      text-align: center;
      border: 2px solid #3498db;
      border-radius: 8px;
      width: 150px;
      outline: none;
    }

    #odpoved.zelene {
      background-color: #d4edda;
      border-color: #28a745;
    }

    #odpoved.cervene {
      background-color: #f8d7da;
      border-color: #dc3545;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
      margin: 4px 0;
      font-size: 0.85rem;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Trénink počítání</h1>

    <div class="controls">
      <div class="control-group">
        <label for="operace">Operace</label>
        <select id="operace">
          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>
      </div>

      <div class="control-group">
        <span class="label-top">1. číslo</span>
        <span class="label-bottom">číslic:</span>
        <select id="cislice1"></select>
      </div>

      <div class="control-group">
        <span class="label-top">2. číslo</span>
        <span class="label-bottom">číslic:</span>
        <select id="cislice2"></select>
      </div>
    </div>

    <div class="error" id="chyba"></div>

    <div class="priklad-oblast">
      <div class="example" id="priklad"></div>
      <div class="cara" id="cara"></div>
      <div class="result-line" id="vysledek"></div>
    </div>

    <div class="odpoved-oblast">
      <input type="text" id="odpoved" inputmode="numeric" />
    </div>

    <button id="tlacitko">START</button>
  </div>

  <script>
    const operaceEl = document.getElementById('operace');
    const cislice1El = document.getElementById('cislice1');
    const cislice2El = document.getElementById('cislice2');
    const chybaEl = document.getElementById('chyba');
    const prikladEl = document.getElementById('priklad');
    const caraEl = document.getElementById('cara');
    const vysledekEl = document.getElementById('vysledek');
    const odpovedEl = document.getElementById('odpoved');
    const tlacitkoEl = document.getElementById('tlacitko');

    for (let i = 1; i <= 9; i++) {
      cislice1El.innerHTML += `<option value="${i}">${i}</option>`;
      cislice2El.innerHTML += `<option value="${i}">${i}</option>`;
    }
    cislice1El.value = '2';
    cislice2El.value = '1';

    function format(cislo) {
      if (typeof cislo === 'bigint') return cislo.toString();
      return cislo.toString();
    }

    function nahodne(n) {
      const min = Math.pow(10, n - 1);
      const max = Math.pow(10, n) - 1;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let priklad = null;
    let faze = 'start'; // start | cekam | hotovo

    function generuj() {
      const op = operaceEl.value;
      const n1 = parseInt(cislice1El.value);
      const n2 = parseInt(cislice2El.value);

      chybaEl.textContent = '';

      if (op === '-' && n1 < n2) {
        chybaEl.textContent = '1. číslo musí být větší';
        return null;
      }

      let a = nahodne(n1);
      let b;
      if (op === '/') {
        b = nahodne(n2);
        if (b === 0) b = nahodne(n2);
      } else {
        b = nahodne(n2);
      }

      if (op === '-' && a <= b) {
        [a, b] = [b, a];
      }

      let v;
      if (op === '+') v = a + b;
      else if (op === '-') v = a - b;
      else if (op === '*') v = BigInt(a) * BigInt(b);
      else if (op === '/') v = a / b;

      return { a, b, op, v };
    }

    function ukazPriklad(p) {
      const fa = format(p.a);
      const fb = format(p.b);
      const fv = format(p.v);
      const max = Math.max(fa.length, (p.op + ' ' + fb).length, fv.length);

      prikladEl.textContent = `${fa.padStart(max)}\n${(p.op + ' ' + fb).padStart(max)}`;
      caraEl.textContent = '─'.repeat(max);
      caraEl.style.display = 'block';
      vysledekEl.textContent = fv.padStart(max);
      vysledekEl.style.display = 'none';
    }

    function ukazVysledek(p) {
      vysledekEl.style.display = 'block';
    }

    function novyPriklad() {
      priklad = generuj();
      if (!priklad) return;
      ukazPriklad(priklad);
      odpovedEl.value = '';
      odpovedEl.className = '';
      faze = 'cekam';
    }

    function zkontroluj() {
      const vstup = odpovedEl.value.trim().replace(',', '.');
      if (vstup === '') return;

      const spravne = vstup === priklad.v.toString();
      odpovedEl.className = spravne ? 'zelene' : 'cervene';
      ukazVysledek(priklad);
      faze = 'hotovo';
    }

    tlacitkoEl.addEventListener('click', () => {
      if (faze === 'start' || faze === 'hotovo') {
        novyPriklad();
        if (priklad) {
          tlacitkoEl.textContent = 'VÝSLEDEK';
          setTimeout(() => {
            odpovedEl.focus();
          }, 100);
        }
      } else if (faze === 'cekam') {
        zkontroluj();
        tlacitkoEl.textContent = 'START';
      }
    });

    odpovedEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        tlacitkoEl.click();
      }
    });

    tlacitkoEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        tlacitkoEl.click();
      }
    });

    // Inicializace
    prikladEl.textContent = '';
    caraEl.textContent = '';
    vysledekEl.textContent = '';
  </script>
</body>
</html>
