<!DOCTYPE html>  
<html lang="cs" class="dark">

<meta charset="UTF-8"/>  
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>  
<title>Trénink počítání</title>

tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}

<style>  
*{margin:0;padding:0;box-sizing:border-box}  
.zelene{background:#15803d!important;border-color:#22c55e!important;color:#fff!important}  
.cervene{background:#b91c1c!important;border-color:#ef4444!important;color:#fff!important}  
input{-webkit-appearance:none;border-radius:.75rem}  
.math-text{white-space:pre;line-height:1.25;display:block;font-variant-numeric:tabular-nums}  
.worksheet-bg{background-color:#e2e8f0;background-image:radial-gradient(circle,#94a3b8 1px,transparent 1px);background-size:24px 24px}  
.dark .worksheet-bg{background-color:rgba(30,41,59,.4);background-image:radial-gradient(circle,#334155 1px,transparent 1px)}  
.btn-pulse{animation:pulse-blue 2.5s infinite}  
@keyframes pulse-blue{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 10px rgba(37,99,235,0)}}  
.btn-glow{animation:glow 2.5s infinite}  
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}  
.shake{animation:shake .5s both}  
@keyframes shake{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(2px,0,0)}30%,50%,70%{transform:translate3d(-3px,0,0)}40%,60%{transform:translate3d(3px,0,0)}}  
.slide-up{animation:slideUp .3s forwards}  
@keyframes slideUp{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}  
.fade-in{animation:fadeIn .3s forwards}  
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}  
.pop{animation:pop .2s}  
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}  
.settings-panel{max-height:150px;opacity:1;overflow:hidden;transition:all .3s ease}  
.settings-panel.collapsed{max-height:0;opacity:0;margin:0!important;pointer-events:none}  
.scrollbar-hide::-webkit-scrollbar{display:none}  
.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}  
.score-bar{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}  
#micBtn{transition:all .2s;display:none}  
#micBtn.visible{display:flex}  
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}  
#micBtn.listening{animation:mic-pulse 1.2s infinite;border-color:#ef4444!important}  
#odpoved.mic-active{border-color:#ef4444!important;box-shadow:0 0 0 2px rgba(239,68,68,.25)}  
</style>  
</head>
