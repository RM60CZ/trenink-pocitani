<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Trénink počítání</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', '"Courier New"', 'monospace'],
                    },
                },
            },
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .zelene {
            background-color: #15803d !important;
            border-color: #22c55e !important;
            color: #ffffff !important;
        }
        .cervene {
            background-color: #b91c1c !important;
            border-color: #ef4444 !important;
            color: #ffffff !important;
        }
        input {
            -webkit-appearance: none;
            border-radius: 0.75rem;
        }
        .math-text {
            white-space: pre;
            line-height: 1.25;
            display: block;
            font-variant-numeric: tabular-nums;
        }
        .worksheet-bg {
            background-color: #f8fafc;
            background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .worksheet-bg {
            background-color: rgba(30, 41, 59, 0.4);
            background-image: radial-gradient(circle, #334155 1px, transparent 1px);
        }
        .btn-pulse {
            animation: pulse-blue 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.45); }
            50% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
        }
        .btn-glow-emerald {
            animation: glow-emerald 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes glow-emerald {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.45); }
            50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }
        #tlacitko { position: relative; }
        #tlacitko.state-start::before {
            content: '▶';
            display: inline-block;
            margin-right: 0.4rem;
            font-size: 0.8em;
        }
        #tlacitko.state-result::before {
            content: '✓';
            display: inline-block;
            margin-right: 0.4rem;
            font-size: 0.85em;
            font-weight: 900;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }
        .slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pop {
            animation: pop 0.2s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .settings-panel {
            max-height: 150px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.3s ease;
        }
        .settings-panel.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            pointer-events: none;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .shake, .pop, .slide-up, .fade-in { animation: none !important; }
            #tlacitko.btn-pulse, #tlacitko.btn-glow-emerald { animation: none !important; }
        }

        /* Fixed score bar */
        .score-bar {
            position: sticky;
            top: 0;
            z-index: 40;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans">

    <!-- App Container - max height 100dvh with flex column -->
    <div class="w-full max-w-md mx-auto flex flex-col min-h-[100dvh]">

        <!-- Fixed Score Bar -->
        <div class="score-bar bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 shadow-sm">
            <div class="px-4 py-2.5 flex items-center justify-between select-none">
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-1.5">
                        <span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">✓</span>
                        <output id="scoreCorrect" aria-live="polite" class="text-lg font-black text-emerald-600 dark:text-emerald-400 font-mono tabular-nums">0</output>
                    </div>
                    <div class="w-px h-5 bg-slate-300 dark:bg-slate-700"></div>
                    <div class="flex items-center gap-1.5">
                        <span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">✗</span>
                        <output id="scoreWrong" aria-live="polite" class="text-lg font-black text-rose-600 dark:text-rose-400 font-mono tabular-nums">0</output>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Série</span>
                    <div class="flex items-center gap-1">
                        <output id="streakCount" aria-live="polite" class="text-lg font-black text-amber-500 dark:text-amber-400 font-mono tabular-nums">0</output>
                        <svg class="w-4 h-4 text-amber-500 dark:text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-4 py-3 space-y-3 scrollbar-hide">

            <!-- Main Card -->
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-lg shadow-slate-200/50 dark:shadow-black/40 overflow-hidden border border-slate-200 dark:border-slate-800">
                <div class="p-4">

                    <!-- Header -->
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex flex-col">
                            <h1 class="text-lg font-black tracking-tight text-slate-800 dark:text-white uppercase leading-tight">
                                Trénink počítání
                            </h1>
                            <div class="flex items-center gap-1.5 mt-0.5">
                                <span id="currentDate" class="text-[11px] font-medium text-slate-400 dark:text-slate-500"></span>
                                <button onclick="document.documentElement.classList.toggle('dark')"
                                        class="p-1 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                                        aria-label="Přepnout tmavý/světlý režim">
                                    <svg class="dark:hidden w-3.5 h-3.5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                    </svg>
                                    <svg class="hidden dark:inline w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button id="settingsToggle" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 mt-0.5" title="Nastavení" aria-label="Nastavení operace a cifer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Settings Panel -->
                    <div id="settingsPanel" class="settings-panel mb-3 collapsed">
                        <div class="grid grid-cols-3 gap-2">
                            <div class="flex flex-col">
                                <label for="operace" class="text-[9px] font-bold uppercase text-slate-500 mb-1 ml-1">Operace</label>
                                <select id="operace" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer font-bold text-xs">
                                    <option value="+">+</option>
                                    <option value="-">−</option>
                                    <option value="*">×</option>
                                    <option value="/">÷</option>
                                </select>
                            </div>
                            <div class="flex flex-col">
                                <label class="text-[9px] font-bold uppercase text-slate-500 mb-1 ml-1">1. Číslo</label>
                                <select id="cislice1" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all text-xs"></select>
                            </div>
                            <div class="flex flex-col">
                                <label class="text-[9px] font-bold uppercase text-slate-500 mb-1 ml-1">2. Číslo</label>
                                <select id="cislice2" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all text-xs"></select>
                            </div>
                        </div>
                        <!-- Division info -->
                        <div id="divisionInfo" class="hidden mt-2 text-[10px] text-slate-400 dark:text-slate-500 text-center font-medium">
                            Dělení zobrazí přesně 4 desetinná místa. Odpověď na 1–4 des. místa je uznána.
                        </div>
                    </div>

                    <!-- Error container -->
                    <div id="chyba" class="text-red-500 text-[10px] font-bold text-center h-4 overflow-hidden mb-1" role="alert"></div>

                    <!-- Worksheet - compact -->
                    <div class="bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 rounded-xl pt-4 px-4 pb-0 mb-3 worksheet-bg relative overflow-hidden flex flex-col justify-center">
                        <div class="w-full overflow-x-auto scrollbar-hide flex flex-col items-end relative z-10">
                            <div id="priklad" style="white-space: break-spaces;" class="math-text font-mono text-lg tracking-tighter text-slate-700 dark:text-slate-200">Zvolte nastavení a stiskněte ▶ Začít</div>
                            <div id="cara" class="math-text font-mono text-2xl text-slate-400 dark:text-slate-600 border-t-2 border-slate-300 dark:border-slate-600 w-full mt-0.5 opacity-0 transition-opacity duration-300"></div>
                        </div>
                    </div>

                    <!-- Action Area -->
                    <div class="space-y-2.5">
                        <div class="relative">
                            <input type="text" id="odpoved" inputmode="decimal" enterkeyhint="done" autocomplete="off"
                                   placeholder="Váš výsledek"
                                   class="w-full pl-3 pr-4 text-lg font-mono font-bold rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:border-blue-500 outline-none transition-all shadow-inner text-right" />
                            <div id="inputIcon" class="absolute right-3 top-1/2 -translate-y-1/2 opacity-0 transition-all duration-200 transform scale-75 pointer-events-none"></div>
                        </div>
                        <div id="enterHint" class="text-[9px] text-slate-400 font-medium opacity-0 transition-opacity duration-200 select-none text-center -mt-1">Enter ↵</div>

                        <button id="tlacitko" type="button"
                                class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-black text-base rounded-xl shadow-lg shadow-blue-500/20 transition-all uppercase tracking-widest touch-manipulation btn-pulse state-start">

            <!-- History - compact -->
            <div id="historyContainer" class="px-1 opacity-0 transition-opacity duration-500 select-none" aria-live="polite">
                <div class="text-[9px] font-bold uppercase text-slate-400 tracking-wider mb-1.5">Historie</div>
                <div id="historyList" class="flex flex-wrap gap-1.5">
                    <div id="historyEmpty" class="text-[11px] text-slate-400 dark:text-slate-500 italic">Zatím jste nevyřešil(a) žádný příklad</div>
                </div>

            <!-- Bottom spacer for mobile -->
            <div class="h-4"></div>
        </div>

    <!-- ═══════ ORIGINAL LOGIC ═══════ -->
    <script>
        let isProcessing = false;

        function formatujCislo(x) {
            if (typeof x === 'bigint') return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            if (typeof x !== 'number') return String(x);
            if (Number.isInteger(x)) return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            const [cela, des] = x.toString().split('.');
            const celaFmt = cela.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return des ? `${celaFmt}.${des}` : celaFmt;
        }

        function normalizuj(vstup) {
            return vstup.trim().replace(/\s+/g, '').replace(',', '.');
        }

        function generujCislo(n) {
            const min = Math.pow(10, n - 1);
            const max = Math.pow(10, n) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        let aktualniPriklad = null;
        let zobrazitVysledek = false;
        const operaceEl = document.getElementById('operace');
        const cislice1El = document.getElementById('cislice1');
        const cislice2El = document.getElementById('cislice2');
        const chybaEl = document.getElementById('chyba');
        const prikladEl = document.getElementById('priklad');
        const caraEl = document.getElementById('cara');
        const odpovedEl = document.getElementById('odpoved');
        const tlacitkoEl = document.getElementById('tlacitko');
        const divisionInfo = document.getElementById('divisionInfo');

        operaceEl.addEventListener('change', () => {
            aktualizujCislici2();
            chybaEl.textContent = '';
            if (operaceEl.value === '/') {
                divisionInfo.classList.remove('hidden');
            } else {
                divisionInfo.classList.add('hidden');
            }
        });

        function aktualizujCislici2() {
            const op = operaceEl.value;
            const firstVal = parseInt(cislice1El.value);
            const options = cislice2El.options;
            for (let i = 0; i < options.length; i++) {
                const val = parseInt(options[i].value);
                options[i].disabled = (op === '-' && val > firstVal);
            }
            if (parseInt(cislice2El.value) > firstVal && op === '-') {
                cislice2El.value = firstVal;
            }
        }

        function naplnSelecty() {
            for (let i = 1; i <= 9; i++) {
                cislice1El.innerHTML += `<option value="${i}">${i}</option>`;
                cislice2El.innerHTML += `<option value="${i}">${i}</option>`;
            }
            cislice1El.value = '2';
            cislice2El.value = '1';
            aktualizujCislici2();
        }

        cislice1El.addEventListener('change', () => {
            aktualizujCislici2();
        });

        function zkratNa4Desetinna(cislo) {
            const str = cislo.toString();
            const [cela, des] = str.split('.');
            if (!des) return cela;
            const desZkracena = des.substring(0, 4);
            return desZkracena ? `${cela}.${desZkracena}` : cela;
        }

        function vygenerujPriklad() {
            const op = operaceEl.value;
            const n1 = parseInt(cislice1El.value);
            const n2 = parseInt(cislice2El.value);
            chybaEl.textContent = '';

            if (op === '-' && n1 < n2) {
                chybaEl.textContent = '❌ Při odčítání musí mít první číslo alespoň tolik cifer jako druhé.';
                return null;
            }

            let a, b, pokusy = 0;
            while (pokusy < 1000) {
                pokusy++;
                a = generujCislo(n1);
                b = n2 === 1 ? Math.floor(Math.random() * 8) + 2 : generujCislo(n2);
                if (op === '-' && a <= b) continue;
                if (op === '/' && b === 0) continue;
                break;
            }
            let vysledek, vysledekZobrazeny;
            if (op === '+') {
                vysledek = a + b;
                vysledekZobrazeny = vysledek;
            } else if (op === '-') {
                vysledek = a - b;
                vysledekZobrazeny = vysledek;
            } else if (op === '*') {
                vysledek = BigInt(a) * BigInt(b);
                vysledekZobrazeny = vysledek;
            } else if (op === '/') {
                vysledek = a / b;
                vysledekZobrazeny = zkratNa4Desetinna(vysledek);
            }
            return { a, b, op, vysledek, vysledekZobrazeny };
        }

        function zobrazPriklad(p) {
            const fa = formatujCislo(p.a);
            const fb = formatujCislo(p.b);
            const fv = formatujCislo(p.vysledekZobrazeny !== undefined ? p.vysledekZobrazeny : p.vysledek);
            const max = Math.max(fa.length, (p.op + ' ' + fb).length, fv.length);
            prikladEl.textContent = `${fa.padStart(max)}\n${(p.op + ' ' + fb).padStart(max)}`;
            caraEl.style.opacity = '0';
        }

        function ukazCaru() {
            caraEl.style.opacity = '1';
        }

        function aktivujPole() {
            odpovedEl.focus();
        }

        function updateBtnDisable() {
            tlacitkoEl.disabled = false;
        }

        function aktualizujTextTlacitka() {
            if (!aktualniPriklad) {
                tlacitkoEl.textContent = 'ZAČÍT';
            } else if (!zobrazitVysledek) {
                tlacitkoEl.textContent = 'DALŠÍ PŘÍKLAD';
            } else {
                tlacitkoEl.textContent = 'VÝSLEDEK(kontrola)';
            }
            updateBtnDisable();
        }

        odpovedEl.addEventListener('input', updateBtnDisable);

        // Kontrola, zda je vstup platné číslo
        function jePlatneCislo(vstup) {
            if (vstup === '') return false;
            const norm = normalizuj(vstup);
            if (norm === '') return false;
            return /^-?\d+([.,]\d*)?$/.test(norm);
        }

        function zkontrolujOdpoved(uzivatelskaOdpoved, priklad) {
            const norm = normalizuj(uzivatelskaOdpoved);
            if (norm === '') return false;
            
            if (priklad.op === '/') {
                const userNum = parseFloat(norm);
                if (isNaN(userNum)) return false;
                
                const trueTruncated = zkratNa4Desetinna(priklad.vysledek);
                const trueNum = parseFloat(trueTruncated);
                
                const userStr = norm;
                const [userCela, userDes = ''] = userStr.split('.');
                const userDesTruncated = userDes.substring(0, 4);
                
                const userNumTruncated = parseFloat(userDesTruncated ? `${userCela}.${userDesTruncated}` : userCela);
                
                const userDecimals = userDes.length;
                if (userDecimals >= 3 && userDecimals <= 4) {
                    const trueDesTruncated = zkratNa4Desetinna(priklad.vysledek).split('.')[1] || '';
                    const trueDesToMatch = trueDesTruncated.substring(0, userDecimals);
                    const trueToMatch = parseFloat(`${zkratNa4Desetinna(priklad.vysledek).split('.')[0]}.${trueDesToMatch}`);
                    const userToMatch = userNumTruncated;
                    
                    return Math.abs(userToMatch - trueToMatch) < 1e-9;
                }
                
                return Math.abs(userNumTruncated - trueNum) < 1e-9;
            } else if (typeof priklad.vysledek === 'bigint') {
                try {
                    return BigInt(norm) === priklad.vysledek;
                } catch {
                    return false;
                }
            } else {
                const num = parseFloat(norm);
                return !isNaN(num) && Math.abs(num - priklad.vysledek) < 1e-9;
            }
        }

        function handleTlacitko(e) {
            if (isProcessing) return;
            isProcessing = true;

            if (e && e.preventDefault) {
                e.preventDefault();
                e.stopPropagation();
            }
            odpovedEl.classList.remove('zelene', 'cervene');

            const btnText = tlacitkoEl.textContent.trim();
            const inputText = odpovedEl.value.trim();

            // ── ZAČÍT nebo DALŠÍ PŘÍKLAD ──
            if (!zobrazitVysledek) {
                // Kontrola slova "smazat" pouze při ZAČÍT
                if (btnText === 'ZAČÍT' && normalizuj(inputText) === 'smazat') {
                    if (typeof window.clearHistory === 'function') {
                        window.clearHistory();
                    }
                }
                
                const p = vygenerujPriklad();
                if (!p) {
                    isProcessing = false;
                    return;
                }
                aktualniPriklad = p;
                zobrazPriklad(p);
                odpovedEl.value = '';
                odpovedEl.placeholder = 'Váš výsledek';
                zobrazitVysledek = true;
                aktualizujTextTlacitka();
                if (p.op === '/') {
                    divisionInfo.classList.remove('hidden');
                } else {
                    divisionInfo.classList.add('hidden');
                }
                setTimeout(() => {
                    ukazCaru();
                    aktivujPole();
                    isProcessing = false;
                }, 50);
            } 
            // ── VÝSLEDEK(kontrola) ──
            else {
                const uziv = inputText;
                
                if (uziv === '') {
                    const vysl = aktualniPriklad.vysledekZobrazeny !== undefined ? aktualniPriklad.vysledekZobrazeny : aktualniPriklad.vysledek;
                    odpovedEl.value = formatujCislo(vysl);
                    zobrazitVysledek = false;
                    aktualizujTextTlacitka();
                    divisionInfo.classList.add('hidden');
                    setTimeout(() => {
                        odpovedEl.focus();
                        isProcessing = false;
                    }, 50);
                } else if (!jePlatneCislo(uziv)) {
                    chybaEl.textContent = '⚠️ Vložil jste nepovolený znak, opravte!';
                    isProcessing = false;
                    setTimeout(() => odpovedEl.focus(), 100);
                } else {
                    const spravne = zkontrolujOdpoved(uziv, aktualniPriklad);
                    odpovedEl.classList.add(spravne ? 'zelene' : 'cervene');
                    zobrazitVysledek = false;
                    aktualizujTextTlacitka();
                    divisionInfo.classList.add('hidden');
                    setTimeout(() => isProcessing = false, 150);
                }
            }
        }

        tlacitkoEl.addEventListener('touchstart', handleTlacitko, { passive: false });
        tlacitkoEl.addEventListener('click', (e) => {
            if (e.pointerType !== 'touch') handleTlacitko(e);
        });
        odpovedEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleTlacitko(e);
        });

        naplnSelecty();
        aktualizujTextTlacitka();
        updateBtnDisable();
        setTimeout(aktivujPole, 100);
    </script>

    <!-- ═══════ UI ENHANCEMENT LAYER ═══════ -->
    <script>
        (function() {
            const STORAGE_KEY = 'matika_trenink_v2';

            function getTodayString() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            function formatDateCzech(dateStr) {
                const [year, month, day] = dateStr.split('-');
                const months = [
                    'ledna', 'února', 'března', 'dubna', 'května', 'června',
                    'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'
                ];
                const dayNum = parseInt(day, 10);
                const monthIndex = parseInt(month, 10) - 1;
                const weekdays = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
                const date = new Date(year, monthIndex, dayNum);
                const weekday = weekdays[date.getDay()];
                return `${weekday} ${dayNum}. ${months[monthIndex]} ${year}`;
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    const state = JSON.parse(raw);
                    const today = getTodayString();
                    if (state.date !== today) {
                        localStorage.removeItem(STORAGE_KEY);
                        return null;
                    }
                    return state;
                } catch (e) {
                    return null;
                }
            }

            function saveState() {
                const state = {
                    date: getTodayString(),
                    correct: correct,
                    wrong: wrong,
                    streak: streak,
                    history: history
                };
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                } catch (e) {}
            }

            let correct = 0, wrong = 0, streak = 0, history = [];
            const savedState = loadState();
            if (savedState) {
                correct = savedState.correct || 0;
                wrong = savedState.wrong || 0;
                streak = savedState.streak || 0;
                history = savedState.history || [];
            }

            const today = getTodayString();
            const currentDateEl = document.getElementById('currentDate');
            if (currentDateEl) {
                currentDateEl.textContent = formatDateCzech(today);
            }

            const btn = document.getElementById('tlacitko');
            const input = document.getElementById('odpoved');
            const inputIcon = document.getElementById('inputIcon');
            const enterHint = document.getElementById('enterHint');
            const scoreCorrect = document.getElementById('scoreCorrect');
            const scoreWrong = document.getElementById('scoreWrong');
            const streakCount = document.getElementById('streakCount');
            const historyContainer = document.getElementById('historyContainer');
            const historyList = document.getElementById('historyList');
            const historyEmpty = document.getElementById('historyEmpty');
            const settingsToggle = document.getElementById('settingsToggle');
            const settingsPanel = document.getElementById('settingsPanel');
            const chybaEl = document.getElementById('chyba');
            const prikladEl = document.getElementById('priklad');
            const caraEl = document.getElementById('cara');
            const divisionInfo = document.getElementById('divisionInfo');

            scoreCorrect.textContent = correct;
            scoreWrong.textContent = wrong;
            streakCount.textContent = streak;

            const iconCheck = `<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>`;
            const iconCross = `<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>`;

            settingsToggle.addEventListener('click', () => {
                settingsPanel.classList.toggle('collapsed');
                if (!settingsPanel.classList.contains('collapsed') && document.getElementById('operace').value === '/') {
                    divisionInfo.classList.remove('hidden');
                } else if (settingsPanel.classList.contains('collapsed')) {
                    divisionInfo.classList.add('hidden');
                }
            });

            const chybaObserver = new MutationObserver(() => {
                if (chybaEl.textContent.trim()) {
                    settingsPanel.classList.remove('collapsed');
                }
            });
            chybaObserver.observe(chybaEl, { childList: true });

            input.addEventListener('focus', () => {
                if (btn.textContent.trim() === 'VÝSLEDEK(kontrola)') {
                    enterHint.style.opacity = '1';
                }
            });
            input.addEventListener('blur', () => enterHint.style.opacity = '0');
            input.addEventListener('input', () => {
                if (input.value.length > 0) enterHint.style.opacity = '0';
            });

            const btnObserver = new MutationObserver(() => {
                const text = btn.textContent.trim();
                btn.classList.remove('state-start', 'state-result', 'btn-pulse', 'btn-glow-emerald');
                if (text === 'VÝSLEDEK(kontrola)') {
                    btn.classList.add('state-result', 'btn-glow-emerald');
                } else {
                    btn.classList.add('state-start', 'btn-pulse');
                }
            });
            btnObserver.observe(btn, { childList: true, characterData: true, subtree: true });

            let processedZelene = false;
            let processedCervene = false;

            const inputObserver = new MutationObserver((mutations) => {
                mutations.forEach((m) => {
                    if (m.type === 'attributes' && m.attributeName === 'class') {
                        const cls = input.classList;
                        if (cls.contains('zelene')) {
                            if (processedZelene) return;
                            processedZelene = true;
                            correct++;
                            streak++;
                            inputIcon.innerHTML = iconCheck;
                            inputIcon.style.opacity = '1';
                            inputIcon.style.transform = 'translateY(-50%) scale(1)';
                            updateScores();
                            addHistory(true);
                            saveState();
                        } else if (cls.contains('cervene')) {
                            if (processedCervene) return;
                            processedCervene = true;
                            wrong++;
                            streak = 0;
                            inputIcon.innerHTML = iconCross;
                            inputIcon.style.opacity = '1';
                            inputIcon.style.transform = 'translateY(-50%) scale(1)';
                            input.classList.add('shake');
                            setTimeout(() => input.classList.remove('shake'), 500);
                            updateScores();
                            addHistory(false);
                            saveState();
                        } else {
                            processedZelene = false;
                            processedCervene = false;
                            inputIcon.style.opacity = '0';
                            inputIcon.style.transform = 'translateY(-50%) scale(0.75)';
                        }
                    }
                });
            });
            inputObserver.observe(input, { attributes: true, attributeFilter: ['class'] });

            function updateScores() {
                scoreCorrect.textContent = correct;
                scoreWrong.textContent = wrong;
                streakCount.textContent = streak;
                streakCount.parentElement.classList.add('pop');
                setTimeout(() => streakCount.parentElement.classList.remove('pop'), 200);
            }

            function addHistory(isCorrect) {
                let text = '';
                if (typeof aktualniPriklad !== 'undefined' && aktualniPriklad) {
                    const p = aktualniPriklad;
                    const fmt = (typeof formatujCislo === 'function') ? formatujCislo : (x) => String(x);
                    const vysl = p.vysledekZobrazeny !== undefined ? p.vysledekZobrazeny : p.vysledek;
                    text = `${fmt(p.a)} ${p.op} ${fmt(p.b)} = ${fmt(vysl)}`;
                } else {
                    text = prikladEl.textContent.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
                }
                if (!text || text.includes('Zvolte nastavení')) return;
                history.unshift({ text, correct: isCorrect });
                // Bez omezení počtu položek
                renderHistory();
            }

            window.clearHistory = function() {
                history = [];
                correct = 0;
                wrong = 0;
                streak = 0;
                updateScores();
                renderHistory();
                saveState();
            };

            function renderHistory() {
                if (history.length === 0) {
                    historyEmpty.style.display = 'block';
                    historyContainer.style.opacity = '0';
                    historyList.querySelectorAll('.history-item').forEach(el => el.remove());
                    return;
                }
                historyEmpty.style.display = 'none';
                historyContainer.style.opacity = '1';
                historyList.querySelectorAll('.history-item').forEach(el => el.remove());
                history.forEach((h, i) => {
                    const item = document.createElement('div');
                    item.className = `history-item slide-up px-2.5 py-1 rounded-md text-[11px] font-mono font-bold border ${
                        h.correct
                            ? 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300'
                            : 'bg-rose-50 dark:bg-rose-900/20 border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300'
                    }`;
                    item.style.animationDelay = `${i * 50}ms`;
                    item.innerHTML = `${h.text} ${h.correct ? '✓' : '✗'}`;
                    historyList.appendChild(item);
                });
            }

            renderHistory();

            const problemObserver = new MutationObserver(() => {
                const txt = prikladEl.textContent;
                if (txt && !txt.includes('Zvolte nastavení')) {
                    prikladEl.classList.remove('fade-in');
                    void prikladEl.offsetWidth;
                    prikladEl.classList.add('fade-in');
                }
            });
            problemObserver.observe(prikladEl, { childList: true });

            const caraObserver = new MutationObserver(() => {
                const isVisible = caraEl.style.opacity === '1';
                if (isVisible) {
                    caraEl.classList.remove('fade-in');
                    void caraEl.offsetWidth;
                    caraEl.classList.add('fade-in');
                }
            });
            caraObserver.observe(caraEl, { attributes: true, attributeFilter: ['style'] });

            const operaceObserver = document.getElementById('operace');
            const divisionObserver = new MutationObserver(() => {
                if (operaceObserver.value === '/' && !settingsPanel.classList.contains('collapsed')) {
                    divisionInfo.classList.remove('hidden');
                } else {
                    divisionInfo.classList.add('hidden');
                }
            });
            divisionObserver.observe(operaceObserver, { attributes: true, attributeFilter: ['value'] });
        })();
    </script>
